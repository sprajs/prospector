<script>
'use strict';
const data=JSON.parse(document.getElementById('prospector-data').textContent), $=id=>document.getElementById(id);
const prospects=new Map((data.prospects||[]).map(x=>[x.id,x]));
const ideas=new Map(data.ideas.map(x=>[x.id,x])), papers=new Map(data.papers.map(x=>[x.id,x]));

const familyLabels={early_expansion:'Early expansion',EDE:'EDE',NEDE:'NEDE',timescape:'Timescape',observation_lineage:'Measurement lineage',scalar_unification:'Scalar histories',interacting_dark_sector:'Interacting sectors',inference_limit:'Inference',SIDM:'Dark matter',kinematic_reconstruction:'Kinematics'};
const tones={EDE:'mint',NEDE:'peach',timescape:'mint',scalar_unification:'pink',interacting_dark_sector:'peach',kinematic_reconstruction:'gray',observation_lineage:'gray',inference_limit:'gray',SIDM:'mint'};
const topicLabels={'early-energy':'Early energy','late-dark-energy':'Dark energy','interacting-sectors':'Dark sectors','inhomogeneity':'Geometry & averaging','kinematics':'Expansion history','modified-gravity':'Gravity','bounces-cycles':'Bounces & cycles','measurement-lineage':'Measurements'};
const all={id:'all',title:'All topics',idea_ids:data.ideas.map(x=>x.id),paper_ids:data.papers.map(x=>x.id)};
let topic='all',view='ideas',selected=null,query='',familyFilter=null;
function el(tag,text,parent,attrs={}){const e=document.createElement(tag);if(text!=null)e.textContent=text;for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(parent)parent.append(e);return e}
function link(parent,text,url){return el('a',text,parent,{href:url,target:'_blank',rel:'noopener'})}
function group(){return topic==='all'?all:data.groups.find(x=>x.id===topic)||all}
function matches(x){return !query||[x.title,x.id,x.family||'',familyLabels[x.family]||'',...(x.authors||[])].join(' ').toLowerCase().includes(query)}
function setHash(){const p=new URLSearchParams({topic,view});if(selected)p.set('item',selected);history.replaceState(null,'','#'+p)}
function route(){familyFilter=null;query='';$('search').value='';const p=new URLSearchParams(location.hash.slice(1));topic=[all,...data.groups].some(x=>x.id===p.get('topic'))?p.get('topic'):'all';view=['ideas','papers','connections','citations','prospects','reading'].includes(p.get('view'))?p.get('view'):'ideas';selected=ideas.has(p.get('item'))||papers.has(p.get('item'))||prospects.has(p.get('item'))?p.get('item'):null;render();if(selected)detail(selected,false)}
function render(){const g=group();const viewCounts={connections:data.edges.filter(e=>g.idea_ids.includes(e.from)&&g.idea_ids.includes(e.to)).length,ideas:g.idea_ids.length,papers:g.paper_ids.length,citations:data.citations.filter(c=>g.paper_ids.includes(c.from)&&g.paper_ids.includes(c.to)).length,prospects:(data.prospects||[]).filter(p=>topic==='all'||p.topic_ids.includes(topic)).length,reading:g.paper_ids.filter(id=>papers.get(id).read).length};for(const b of document.querySelectorAll('[data-view]')){let count=b.querySelector('small');if(!count)count=el('small','',b);count.textContent=viewCounts[b.dataset.view]}$('topic-title').textContent=topic==='all'?'Cosmology':g.title;$('totals').textContent=`${g.idea_ids.length} ideas · ${g.paper_ids.length} papers`;
for(const b of $('topics').querySelectorAll('[data-topic]'))b.setAttribute('aria-current',String(b.dataset.topic===topic));for(const b of document.querySelectorAll('[data-view]')){const active=b.dataset.view===view;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1}$('view').setAttribute('aria-labelledby','tab-'+view);$('view').replaceChildren();
if(view==='papers')renderPapers(g);else if(view==='connections')renderConnections(g);else if(view==='citations')renderCitations(g);else if(view==='prospects')renderProspects(g);else if(view==='reading')renderPapers({...g,paper_ids:g.paper_ids.filter(id=>papers.get(id).read)});else renderIdeas(g);setHash()}
function ideaNode(id,parent){const x=ideas.get(id),b=el('button',null,parent,{class:'node'+(selected===id?' selected':''),'data-node':id,'data-tone':tones[x.family]||'plum'});el('span',x.title,b);el('small',familyLabels[x.family]||x.family.replaceAll('_',' '),b);b.onclick=()=>detail(id);return b}
function treeNode(id,parent,children,branch=new Set()){const row=el('div',null,parent,{class:'tree'});ideaNode(id,row);if(branch.has(id))return row;const next=new Set(branch).add(id),ids=children.get(id)||[];if(ids.length){const box=el('div',null,row,{class:'children'});for(const child of ids)treeNode(child,box,children,next)}return row}
function connectForest(forest,relations){const old=forest.querySelector('svg');if(old)old.remove();const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');const w=forest.scrollWidth,h=forest.scrollHeight;svg.setAttribute('width',w);svg.setAttribute('height',h);svg.setAttribute('aria-hidden','true');forest.prepend(svg);const box=forest.getBoundingClientRect();const coords=new Map([...forest.querySelectorAll('[data-node]')].map(e=>{const r=e.getBoundingClientRect();return[e.dataset.node,{x:r.left-box.left,y:r.top-box.top,w:r.width,h:r.height}]}));for(const {from,to} of relations){const a=coords.get(from),b=coords.get(to);if(!a||!b)continue;const path=document.createElementNS(ns,'path'),x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2,m=(x1+x2)/2;path.setAttribute('d',x2<x1?`M${a.x+18} ${a.y+a.h} V${y2} H${x2}`:`M${x1} ${y1} C${m} ${y1},${m} ${y2},${x2} ${y2}`);path.setAttribute('class','edge-line');svg.append(path)}}
let forestObserver;function watchForest(forest,relations){forestObserver?.disconnect();forestObserver=new ResizeObserver(()=>connectForest(forest,relations));forestObserver.observe(forest);requestAnimationFrame(()=>connectForest(forest,relations))}
function renderIdeas(g){const ids=g.idea_ids.filter(id=>matches(ideas.get(id))&&(!familyFilter||ideas.get(id).family===familyFilter));if(!ids.length){el('div',query?'0 ideas':'0 ideas',$('view'),{class:'empty'});return}const chosen=new Set(ids),children=new Map(),childIds=new Set(),links=[];
for(const e of data.edges)if(e.type==='specializes'&&chosen.has(e.from)&&chosen.has(e.to)){if(!children.has(e.to))children.set(e.to,[]);children.get(e.to).push(e.from);childIds.add(e.from);links.push({from:e.to,to:e.from})}
const viewport=el('div',null,$('view'),{class:'viewport'}),forest=el('div',null,viewport,{class:'forest'});const size=id=>1+(children.get(id)||[]).reduce((n,c)=>n+size(c),0);for(const id of ids.filter(x=>!childIds.has(x)).sort((a,b)=>size(b)-size(a)))treeNode(id,forest,children);watchForest(forest,links);
}
function renderConnections(g){const chosen=new Set(g.idea_ids),edges=data.edges.filter(e=>chosen.has(e.from)&&chosen.has(e.to)&&(matches(ideas.get(e.from))||matches(ideas.get(e.to))));const section=el('section',null,$('view'),{class:'connection-list'});if(!edges.length)el('div','0 connections',section,{class:'empty'});for(const e of edges){const row=el('div',null,section,{class:'connection-row'});const a=el('button',ideas.get(e.from).title,row);a.onclick=()=>detail(e.from);const type=el('button',labels[e.type],row,{class:'connection-type'});type.onclick=()=>{detail(e.from);edgeDetail(e,e.from)};const b=el('button',ideas.get(e.to).title,row);b.onclick=()=>detail(e.to)}}

function renderProspects(g){const items=(data.prospects||[]).filter(p=>(topic==='all'||p.topic_ids.includes(topic))&&matches(p));const list=el('div',null,$('view'),{class:'prospect-list'});const labels=el('div',null,list,{class:'assembly-labels'});for(const t of ['Baseline','Ideas','Prospect'])el('span',t,labels);for(const p of items){const row=el('article',null,list,{class:'assembly'});el('div',p.baseline.label,row,{class:'assembly-baseline'});const changes=el('div',null,row,{class:'assembly-ideas'});for(const [i,id] of p.model_idea_ids.entries()){if(i)el('span',p.kind==='alternative_branches'?'or':'+',changes,{class:'assembly-operator'});const b=el('button',ideas.get(id).title,changes);b.onclick=()=>detail(id)}const target=el('button',p.title,row,{class:'assembly-target','data-node':p.id});target.onclick=()=>detail(p.id)}if(!items.length)el('div','0 prospects',list,{class:'empty'});el('h3','Combined prospects · '+items.filter(p=>p.kind==='combination').length,list)}
function values(parent,list){if(Array.isArray(list)){const ul=el('ul',null,parent);for(const v of list)el('li',v,ul)}else el('p',list,parent)}
function scienceSection(pane,title,content,open=false){const section=el('details',null,pane,{class:'science-section'});if(open)section.open=true;el('summary',title,section);values(section,content);return section}
function prospectDetail(p,focus=true){$('detail').hidden=false;$('content').classList.add('has-detail');const pane=$('detail');pane.replaceChildren();const head=el('div',null,pane,{class:'detail-head'});el('h2',p.title,head);const close=el('button','×',head,{class:'close','aria-label':'Close details'});close.onclick=closeDetail;if(focus)close.focus({preventScroll:true});el('h3',p.baseline.role==='comparison'||p.baseline.role==='working_assumption'?'Reference cosmology':'Baseline',pane);el('p',p.baseline.label,pane);scienceSection(pane,'Changes',p.cosmology.modifications,true);scienceSection(pane,'Unknowns',p.unknowns,true);for(const [key,value] of Object.entries(p.cosmology)){if(key==='modifications')continue;scienceSection(pane,key[0].toUpperCase()+key.slice(1).replaceAll('_',' '),value)}scienceSection(pane,'Scope',p.scope);scienceSection(pane,'Baseline assumptions',p.baseline.scope);const section=el('details',null,pane,{class:'science-section'});el('summary','Related ideas',section);for(const id of p.idea_ids){const b=el('button',ideas.get(id).title,section,{class:'relation'});b.onclick=()=>detail(id)}el('h3','Papers',pane);const seen=new Set();for(const s of p.source_evidence){if(seen.has(s.paper_id))continue;seen.add(s.paper_id);const paper=papers.get(s.paper_id),row=el('div',null,pane,{class:'source'}),b=el('button',paper.title,row,{class:'paper-title'});b.onclick=()=>detail(paper.id);link(row,'arXiv ↗',paper.url);link(row,'PDF ↗',paper.pdf)}}
function paperInfo(p,parent){el('div',p.authors.join(', '),parent,{class:'authors'})}
function renderPapers(g){const list=el('div',null,$('view'),{class:'paper-list'}),items=g.paper_ids.map(id=>papers.get(id)).filter(matches).sort((a,b)=>b.date.localeCompare(a.date)||a.title.localeCompare(b.title));if(!items.length)el('div','0 papers',list,{class:'empty'});for(const p of items){const row=el('article',null,list,{class:'paper-row'});el('div',p.date.slice(0,4),row,{class:'paper-year'});const info=el('div',null,row),b=el('button',p.title,info,{class:'paper-title','data-node':p.id});b.onclick=()=>detail(p.id);paperInfo(p,info);link(row,'arXiv ↗',p.url)}}
function paperNode(p,parent,key){const b=el('button',null,parent,{class:'node','data-node':key});el('span',p.title,b);el('small',p.date.slice(0,4)+' · '+p.base_id,b);b.onclick=()=>detail(p.id);return b}
function renderCitations(g){const chosen=new Set(g.paper_ids),edges=data.citations.filter(e=>chosen.has(e.from)&&chosen.has(e.to)&&(matches(papers.get(e.from))||matches(papers.get(e.to))));if(!edges.length){el('div','0 citation links',$('view'),{class:'empty'});return}const viewport=el('div',null,$('view'),{class:'viewport'}),forest=el('div',null,viewport,{class:'forest paper-tree'}),sources=[...new Set(edges.map(e=>e.from))],links=[];for(const from of sources){const row=el('div',null,forest,{class:'tree'});paperNode(papers.get(from),row,from);const kids=el('div',null,row,{class:'children'});for(const edge of edges.filter(e=>e.from===from)){const child=el('div',null,kids,{class:'tree'}),key=from+'>'+edge.to;paperNode(papers.get(edge.to),child,key);links.push({from,to:key})}}watchForest(forest,links)}
function detail(id,focus=true){if(prospects.has(id)){selected=id;setHash();prospectDetail(prospects.get(id),focus);return}selected=id;setHash();$('detail').hidden=false;$('content').classList.add('has-detail');const pane=$('detail');pane.replaceChildren();const x=ideas.get(id)||papers.get(id),head=el('div',null,pane,{class:'detail-head'});el('h2',x.title,head);const close=el('button','×',head,{class:'close','aria-label':'Close details'});close.onclick=closeDetail;if(focus)close.focus({preventScroll:true});for(const n of document.querySelectorAll('[data-node]'))n.classList.toggle('selected',n.dataset.node===id);
if(ideas.has(id)){for(const [title,values] of [['Assumptions',x.assumptions],['Predictions',x.predictions]]){if(!values?.length)continue;el('h3',title,pane);const list=el('ul',null,pane);for(const v of values)el('li',v,list)}el('h3','Papers',pane);for(const source of x.sources){const p=papers.get(source.paper_id),row=el('div',null,pane,{class:'source'}),b=el('button',p.title,row,{class:'paper-title'});b.onclick=()=>detail(p.id);el('div',source.locator,row,{class:'locator'});link(row,'arXiv ↗',p.url);link(row,'PDF ↗',p.pdf)}const related=data.edges.filter(e=>(e.from===id||e.to===id)&&ideas.has(e.from)&&ideas.has(e.to));if(related.length){el('h3','Connections',pane);for(const e of related){const other=e.from===id?e.to:e.from,b=el('button',null,pane,{class:'relation'});el('span',e.type==='specializes'?(e.from===id?'Specializes':'Specializations'):labels[e.type],b);el('div',ideas.get(other).title,b);b.onclick=()=>edgeDetail(e,id)}}}
else{paperInfo(x,pane);const source=el('div',null,pane,{class:'source'});link(source,'arXiv ↗',x.url);link(source,'PDF ↗',x.pdf);const abstract=el('details',null,pane,{class:'abstract'});el('summary','Abstract',abstract);abstract.addEventListener('toggle',()=>{if(abstract.open&&!abstract.dataset.loaded){abstract.dataset.loaded='true';loadAbstract(x,abstract)}});const these=data.ideas.filter(i=>i.sources.some(s=>s.paper_id===id));if(these.length){el('h3','Ideas',pane);for(const i of these){const b=el('button',i.title,pane,{class:'relation'});b.onclick=()=>detail(i.id)}}for(const direction of ['from','to']){const links=data.citations.filter(c=>c[direction]===id);if(!links.length)continue;el('h3',direction==='from'?'Cites':'Cited by',pane);for(const c of links){const other=papers.get(c[direction==='from'?'to':'from']),b=el('button',null,pane,{class:'relation'});el('div',other.title,b);el('span',`[${c.reference}] · ${other.base_id}`,b);b.onclick=()=>detail(other.id)}}}}
function edgeDetail(e,origin){const pane=$('detail');pane.replaceChildren();const head=el('div',null,pane,{class:'detail-head'});el('h2',labels[e.type],head);const close=el('button','×',head,{class:'close','aria-label':'Close details'});close.onclick=closeDetail;close.focus({preventScroll:true});el('p',e.rationale,pane);for(const id of [e.from,e.to]){const b=el('button',ideas.get(id).title,pane,{class:'relation'});b.onclick=()=>detail(id)}el('h3','Sources',pane);for(const s of e.evidence){const p=papers.get(s.paper_id);const row=el('div',null,pane,{class:'source'});link(row,p.title+' ↗',p.url);el('div',s.locator,row,{class:'locator'})}}
async function loadAbstract(p,parent){const text=el('p','…',parent);try{const r=await fetch('/api/abstract?id='+encodeURIComponent(p.id),{headers:{Accept:'application/json'}});if(!r.ok)throw new Error();const result=await r.json();if(result.id!==p.id||typeof result.abstract!=='string'||!result.abstract)throw new Error();text.textContent=result.abstract}catch{text.remove();link(parent,'Abstract on arXiv ↗',p.url)}}
function closeDetail(){$('detail').hidden=true;$('content').classList.remove('has-detail');const previous=selected;selected=null;for(const n of document.querySelectorAll('[data-node]'))n.classList.remove('selected');setHash();const b=[...document.querySelectorAll('[data-node]')].find(n=>n.dataset.node===previous);b?.focus({preventScroll:true})}
for(const g of [all,...data.groups]){const wrapper=el('div',null,$('topics'),{class:'topic-item'});const b=el('button',null,wrapper,{'data-topic':g.id});el('span',topicLabels[g.id]||g.title,b,{class:'topic-label'});el('span',String(g.paper_ids.length),b,{class:'count'});b.onclick=()=>{topic=g.id;query='';familyFilter=null;$('search').value='';closeDetail();if(!g.idea_ids.length&&view==='ideas')view='papers';render();document.querySelector('nav').classList.remove('open');document.querySelector('.mobile-topics').setAttribute('aria-expanded','false')};const families=[...new Set(g.idea_ids.map(id=>ideas.get(id).family))];if(families.length>1){const box=el('div',null,wrapper,{class:'topic-families',hidden:''});const expand=el('button','›',wrapper,{class:'expand-topic','aria-label':'Expand '+(topicLabels[g.id]||g.title),'aria-expanded':'false'});expand.onclick=()=>{box.hidden=!box.hidden;expand.textContent=box.hidden?'›':'⌄';expand.setAttribute('aria-expanded',String(!box.hidden))};for(const family of families){const child=el('button',familyLabels[family]||family.replaceAll('_',' '),box);child.onclick=()=>{topic=g.id;view='ideas';query='';familyFilter=family;$('search').value='';closeDetail();render();document.querySelector('nav').classList.remove('open');document.querySelector('.mobile-topics').setAttribute('aria-expanded','false')}}}}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{view=b.dataset.view;familyFilter=null;closeDetail();render()};document.querySelector('.tabs').onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const tabs=[...document.querySelectorAll('[data-view]')],i=tabs.findIndex(t=>t.dataset.view===view),n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;tabs[n].click();tabs[n].focus()};$('search-toggle').onclick=()=>{const input=$('search'),open=input.hidden;input.hidden=!open;$('search-toggle').setAttribute('aria-expanded',String(open));if(open)input.focus();else{input.value='';query='';familyFilter=null;render()}};$('sidebar-toggle').onclick=()=>{const shell=document.querySelector('.shell');shell.classList.toggle('collapsed');$('sidebar-toggle').setAttribute('aria-expanded',String(!shell.classList.contains('collapsed')));$('sidebar-toggle').setAttribute('aria-label',shell.classList.contains('collapsed')?'Expand sidebar':'Collapse sidebar')};$('search').oninput=e=>{familyFilter=null;query=e.target.value.toLowerCase().trim();render()};document.querySelector('.mobile-topics').onclick=e=>{const nav=document.querySelector('nav');nav.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(nav.classList.contains('open')))};window.addEventListener('hashchange',route);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});route();
</script>
