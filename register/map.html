022v1", "visibility": []}], "prospects": [{"additional_source_contracts": [{"limitations": ["Omega_phi(a) cannot be substituted for the instantaneous total-density fraction. A constant density-normalizer interpretation and any Omega_phi,0-to-X_c conversion are conditional reader conventions until the original implementation fixes their ownership.", "For separately conserved positive scalar and aggregate non-scalar densities, 0\u003cF\u003c1 and a common pressure/density convention, an interior stationary fraction requires w_phi=w_other. With w_total=F w_phi+(1-F)w_other, this is equivalent to w_total=w_phi only on that positive two-sector decomposition. For n=3 the conditional relation is y=(a_stat/a_c)^(9/2)=(1+w_other(a_stat))/(1/2-w_other(a_stat)), requiring -1\u003cw_other(a_stat)\u003c1/2 and finite positive y. The denominator vanishes at w_other=1/2; w_other=-1 gives no finite positive y. The relation is implicit for a varying background and does not establish a maximum, a unique peak or a numerical peak fraction; boundaries and a derivative sign change must also be checked.", "The cosine argument varphi/f requires compatible units, but the selected letter does not specify physical units or the normalization/domain of sampled phi_i. No field value, angle range or prior bound is inferred from fitted summaries. Early dot varphi_i=0 is a source assumption, not a supplied full initial-mode prescription.", "The explicit MontePython footnote URL and CLASS bibliography are navigation witnesses, not an EDE repository/commit/configuration. Original code identity is unresolved within the retained sources, rather than proved globally unavailable.", "The reviewer fluid independently chooses X=rho_fluid/rho_crit,ref,0, a nine-halves density shape and compensated Lambda at fixed H0. Its source interface has density_at_transition, transition_scale and ruler_endpoint, with a complete retained thermal reference. These are not source-normalized scalar coordinates or an admitted mentation still needs inspection.", "modifications": ["Alternative branch: Hubble-frozen scalar with (1-cos(phi/f))^n potential, followed by averaged oscillatory dilution.", "Alternative branch: initially linear potential rolling toward zero, treated in the kinetic n→infinity limit. These alternatives are not two coexisting added fields."], "observables": ["Minimal test: rho_phi, H, fractional early energy and fixed-endpoint r_s versus matched zero-EDE control.", "Source fit: CMB spectra/lensing, BAO/growth, SN distances and H0 likelihood; no current-data reassessment."], "perturbations": "Source model uses effective density/heat-flux perturbations and potential-dependent rest-frame sound speed. The minimal ruler test omits this closure, recombination and the fitted parameter compensation."}, "id": "ede-fixed-endpoint-ruler", "idea_ids": ["ede-oscillating-scalar", "ede-slowly-rolling-scalar"], "investigations": [{"assumptions": ["Hubble-frozen initial scalar; potential proportional to (1-cos(phi/f))^n.", "Effective-fluid averaging, initial angle and potential-dependent sound speed.", "Potential linear initially and tends to zero.", "Letter treats effective n→infinity limit, cs²=1; detailed potential deferred."], "equations": [{"definitions": "a0=1; ac transition scale; wn averaged post-transition equation of state. Omega_phi is not the instantaneous total-density fraction; fixed normalization needs source-code verification.", "domain": "Paper effective-fluid background, finite-n oscillator or declared kinetic limit; no perturbation or CMB admission.", "expression": "Omega_phi(a)=2 Omega_phi(a_c)/[1+(a/a_c)^{3(1+w_n)}]; w_n=(n-1)/(n+1)", "locator": "Eqs. (1)-(2), PDF p.2", "paper_id": "arxiv:1811.04083v2", "status": "needs_verification"}, {"definitions": "Explicit physical density normalization; fc fraction at ac, not a peak fraction. Current density closure must be declared.", "domain": "Proposed FLRW background toy test with positive densities and 0\u003c=fc\u003c1 ncertainty; it is not a raw-detector or stellar-state distribution. Previous247±35km/s uses a different aperture.", "Imaging models include PSF B, image covariance C_D, lens light l and dust K. F814W source/potential reconstruction, quadratic regularization, representative-model prior weights and M5 substitution are approximations. Actual author products, masks and model support remain unverified.", "ACS gamma'2.08 with Gaussian standard deviation0.03 is a fitted imaging-conditioned prior. Thin degeneracy-tube optimization, equal G1/G2 slopes, radio/NICMOS data and delay-log-likelihood subtraction are retained conditions; complete marginalization or removal of all dependencies is unqualified. Table1's mean/scatter across three inferred H0 values omits delay uncertainty and is not a measured joint H0 error.", "Fassnacht v1 environment counts use the first four GO10158 F814W exposures (2528s), distinct from its quoted28144s deep total and Suyu's full reconstruction. Vega/AUTO magnitudes, star/artifact cuts, cosmic-ray masks and lens-centred versus control-grid apertures define the sample. Raw catalogues, weights, detection completeness and reduction equivalence are unverified.", "Suyu's OBS prior uses18.5≤m_F814W\u003c24.5 within45arcsec and simulated selection1.95≤n/\u003cn\u003e\u003c2.05. Unlike the MS strong-lens subset, OBS neither subtracts a primary lens plane nor requires strong lensing. Approximate m_F814W=0.5m_i+0.5m_z, galaxy modelling, cosmology and high-convergence/local-environment treatment condition the prior; counts are not measured convergence.", "Source variants remain unresolved: Suyu's2024 draft line versus2010 v2 watermark; Fassnacht abstract259 COSMOS fields versus body257 images; Fig1 caption68%/90% versus adjacent prose68%/95%. No replacement count or interval is inferred.", "Spherical dynamics, stellar profiles, aperture/seeing convolution, radial-anisotropy prior and fixed-radius/redshift approximations remain author inputs. Pixel, delay, kinematic, calibration, catalogue, simulation and cross-probe covariance/distributions remain unknown.", "GO10158 F606W/F814W author imaging, NICMOS F160W proposal7422, historical WFPC2 GO6555 and current RAW/FLT/HLET/TRL are distinct histories. Current2026 calibrated products do not reconstruct the2010 author reduction. Source-specific ownership/rights of spectra, PSFs, catalogues, simulations and author products remain unknown; unread or unacquired material is not proven absent."], "scopes": [{"checked_claim": "Selected Suyu locators distinguish radio delays relative to image B, ACS GO10158 F606W/F814W reconstruction and Keck1/LRIS aperture-dispersion fitting. Eq27 assumes independent individual delay PDFs; Eq32 explicitly approximates the fitted dispersion likelihood as Gaussian. The original delay source uses smoothed-composite Monte Carlo inputs with assumed Gaussian perturbations but reports non-Gaussian recovered delay distributions and68%/95% intervals. ACS slope is an imaging-conditioned posterior reused as a prior, including radio/NICMOS/delay optimization and stated delay-likelihood subtraction. M5 PSF-B1/three-band-dust substitution and regularization are author approximations. The count source uses four F814W exposures and Vega/AUTO selection. The OBS prior selects simulated overdense sightlines and differs from MS primary-lens-plane-excluded strong-lens selection.", "paper_ids": ["arxiv:0910.2773v2"], "scope_id": "NEXT-18", "title": "Author observation and inference-product lineage", "unresolved": "Radio time series, visibility/calibration and joint delay covariance; Keck spectra, complete slit/seeing geometry, templates/weights and spectral covariance; author PSF, dust, lens light, image covariance, masks and reconstruction products; catalogue/simulation identities and shared calibration/selection covariance remain unverified. Source factorization and fitted Gaussian priors are not measured native laws. Current archival processing does not establish the itions, PSF correction and selected sample ancestry. It supplies neither independent observations nor a full arrival, quantum-efficiency, gain, extraction or censoring likelihood. Artificial-star realizations and underlying images remain unexamined.", "The metallicity covariance expression has units mag squared when Z_W is expressed in mag/dex and abundance differences in dex. Its dependence on fitted Z_W and on calibration choices does not provide a rowwise generator for altering the released covariance, independent Gaussian row noises, or known confidence coverage and covariance for the underlying calibration summaries.", "The Wesenheit definition is a calibrated color/magnitude convention with stated source assumptions. It assigns neither a physical unit to slot44 or row3213 nor a normalized coordinate-density measure. The authors’ warning about varying host reddening coefficients is retained as an attributed argument, without adopting a replacement model or independently qualifying competing analyses.", "The Yuan source documents historical optical processing, Vega calibration and selected-cut ancestry for NGC4258. The remaining selection stages, completeness, NIR reduction, original events and mapping into every released compact row are unexamined. Software versions identify the reported historical pipeline; they are not current capability claims.", "Original47/fixed44 and the older compact44 target remain separate conditioned identities. The third-party Skara ordering and ordinal witnesses do not become producer definitions. All four failed joins, the nine recorded Skara literal conflicts, the Riess Eq2/displayed-matrix sign issue and selection-count discrepancies remain unrepaired. Physical meaning, unit, prior and generator for original44 remain unknown."], "scopes": [{"checked_claim": "Riess v3 Appendix B.1 compares aperture and PSF photometry using the same images and fixed Cepheid positions, with a selected low-background subset and a PSF-derived aperture correction. Section3.5 Eq9 and Appendix C propagate mean-versus-PP04 abundance-scale differences through Z_W squared; the source requires iteration with the coefficient from the global fit. Appendix D defines the Wesenheit coordinate as dereddened and conditions its relative-distance use on intrinsic color and sample assumptions. The explicitly linked Yuan2203.06681v1 source supplies an NGC4258 optical image/photometry/calibration pipeline and selected-cut ancestry, and directs NIR results to Riess. These are primary source definitions and conditioning, not a complete released-row generator.", "paper_ids": ["arxiv:2112.04510v3"], "scope_id": "NEXT-04", "title": "Primary reduction evidence and compact-input boundaries", "unresolved": "Producer original47-axis dictionary and serialization/reduction program; original zero-based slot44 physical meaning, unit, fixed-coordinate rationale and physical-prior interpretation; exact compact constraints3207–3214 ancestry and units; four failed physical joins2630/2744/2745/2754; literal source conflicts and aliases; physical joint covariance/selection/extraction law; numerical, observational and inference qualification."}], "sources": [{"conditioning": "Selected original pp21,59–60,62–64; important Eq9/Eq22 and shared-input statements checked on original page images. Main formalism and existing fixed44 reconstruction are contextual ancestry; no new fit or full-paper review.", "id": "riess-2112-04510v3-primary-conditioning", "role": "primary_paper_selected_claims", "sha256": "572e5d2c0f32bf6e80a118eec13ed0107e1e2830f9ebe90b5bc4e9d1b7fa5df1", "url": "https://arxiv.org/pdf/2112.04510v3"}, {"conditioning": "Pinned producer high-level y/L/C release and explicit Yuan link; no complete original numerical-axis or rowwise dictionary inferred from these source pointers.", "id": "riess-c447-primary-release-readme", "role": "primary_release_document", "sha256": "fd845e484a184ad9740dddf26550db9d6d154d1631c1b30622dcecefe8ee7174", "url": "htt t ordinal convention, the selected old rows 2630/2744/2745/2754 yield reduced-data witnesses without physical object IDs. All four physical joins remain failed; no tolerance change or new join is justified.", "Selected column units and conditional linear covariance formulas do not establish original selection/calibration/reduction ancestry, a physical joint observation likelihood, uncertainty coverage or independent Gaussian row noises. Full table/FITS equivalence, covariance/rank, fits and cosmological interpretation remain unqualified."], "scopes": [{"checked_claim": "The journal DOI 10.3390/universe8100502 and notebook pinned at e36d6c84 describe Y = Lq with 47 retained entries, label one-based slot 45 X, and explicitly transpose the released allL for that orientation. Electronic Table E1 declares mag/dex columns and within-host rankings; selected ordinal witnesses preserve the four unmatched rows. The producer source separately fixes original zero-based coordinate 44 through zero-width uniform support. These are documentary definitions and conditioning, not producer physical identities or new fits.", "paper_ids": ["arxiv:2112.04510v3"], "scope_id": "NEXT-04", "title": "Third-party coordinate and row conventions", "unresolved": "Original coordinate 44 physical meaning/unit and fixed-slot rationale, producer dictionary/generator, four physical joins, exact reduction/constraint ancestry, aliases and literal source variants, physical covariance/selection law and every numerical/inference gate."}], "sources": [{"conditioning": "Selected journal reconstruction claims; separate journal DOI identity, not producer-source authority or arxiv full review.", "id": "skara-universe8100502-journal", "role": "journal_pdf", "sha256": "7e1d1f6e601fae64cfe007bc2f899a60fb1daff3e6c1b9d6dadeeddecfd4b23b", "url": "https://mdpi-res.com/d_attachment/universe/universe-08-00502/article_deploy/universe-08-00502.pdf"}, {"conditioning": "Pinned author reconstruction at e36d6c84; documentary/c SH0ES/DataRelease/c447f0fea703fcd0fff57de5000947b5ca81286b/SH0ES_Data/lstsq_results.txt"}], "title": "SH0ES reduced-input ordering in the Skara reconstruction"}, {"limitations": ["The finite box and released preprocessing retain full-fit/withheld information. This is conditional on those frozen products, with no independent physical heldout interpretation.", "Riess v3 Eq2 and displayed y/L have an unrepaired anchor-offset sign inconsistency. No physical distance projection is accepted.", "No FITS decoding, array extraction, rank/SPD calculation, table rejoin, refit, density/evidence computation or numerical qualification occurred.", "No source-equivalent Fit15 reproduction, new H0 measurement or cosmological tension significance. Missing cross-covariances remain unknown."], "scopes": [{"checked_claim": "The source box has 47 original coordinates. Coordinate44 has zero center/width and no checked physical label; this diagnostic fixes it to literal0 and retains active0–43,45,46. The four failed original photometry joins remain unchanged.", "paper_ids": ["arxiv:2112.04510v3"], "scope_id": "NEXT-04", "title": "Partial original-coordinate identity", "unresolved": "This packet does not reconstruct the FITS generator, supply event identities or resolve compact-versus-paper reductions. Separate NEXT04 consumer evidence must be explicitly accepted."}, {"checked_claim": "The paper compares an anchor geometric distance with a fit omitting that geometric constraint while retaining its Cepheids (§6.2 pp38,41; Table5 Fit15 p28; Figure19 p40). The separately declared diagnostic withholds only original row3213, retaining the remaining3491 released rows, full joint covariance and same normalized46-coordinate finite box. Training uses the principal covariance marginal C_TT, not a deleted precision block.", "paper_ids": ["arxiv:2112.04510v3"], "scope_id": "NEXT-05", "title": "One withheld released observation", "unresolved": "The diagnostic retains full-fit prior, reference-modulus preprocessing, globally conditioned MW summaries and photometry/clipping. Eq2 versus displayed y/L sign, physical row/reduction joins, true refit/selection/calibration, train rank/SPD, finite-box evidence ratio budgets and native consumer acceptance remain open."}], "sources": [{"conditioning": "Pinned original paper v3 or release c447f0fea703fcd0fff57de5000947b5ca81286b; selected source checks only. FITS whole-byte hashes are not decoded-array or physical reduction verification.", "id": "README.md", "role": "primary_release_code_or_document", "sha256": "fd845e484a184ad9740dddf26550db9d6d154d1631c1b30622dcecefe8ee7174", "url": "https://raw.githubusercontent.com/PantheonPlusSH0ES/DataRelease/c447f0fea703fcd0fff57de5000947b5ca81286b/SH0ES_Data/README.md"}, {"conditioning": "Pinned original paper v3 or release c447f0fea703fcd0fff57de5000947b5ca81286b; selected source checks only. FITS whole-byte hashes are not decoded-array or physical reduction verification.", "id": "read_chains_example.py", "role": "primary_release_code_or_document", "sha256": "2cf388a78dd1a53d91fdc0b18451ca77b907679e9d59f05061195c78ddf93dcc", "url": "https://raw.githubusercontent.com/PantheonPlusSH0ES/DataRelease/c447f0fea703fcd0fff57de5000947b5ca81286b/SH0ES_Data/read_chains_example.py"}, {"conditioning": "Pinned original paper v3 or release c447f0fea703fcd0fff57de5000947b5ca81286b; selected source checks only. FITS whole-byte hashes are not decoded-array or physical reduction verification.", "id": "Riess-2112.04510v3.pdf", "role": "primary_paper", "sha256": "572e5d2c0f32bf6e80a118eec13ed0107e1e2830f9ebe90b5bc4e9d1b7fa5df1", "url": "https://arxiv.org/pdf/2112.04510v3"}, {"conditioning": "Pinned original paper v3 or release c447f0fea703fcd0fff57de5000947b5ca81286b; selected source checks only. FITS whole-byte hashes are not decoded-array or physical reduction verification.", "id": "table2.tex", "role": "primary_rounded_photometry_table", "sha256": "d4b9af2b5d65118f7ac44a41b7e8cd662dfd42a63b5c359ca402d sha256": "9a2ce872dd20ed4fdf5005ce62a805d3eefbbb0b20b0c614013e7c0094009db8", "url": "https://raw.githubusercontent.com/PantheonPlusSH0ES/DataRelease/c447f0fea703fcd0fff57de5000947b5ca81286b/SH0ES_Data/alll_shoes_ceph_topantheonwt6.0_112221.fits"}, {"conditioning": "Pinned original paper v3 or release c447f0fea703fcd0fff57de5000947b5ca81286b; selected source checks only. FITS whole-byte hashes are not decoded-array or physical reduction verification.", "id": "ally_shoes_ceph_topantheonwt6.0_112221.fits", "role": "released_compact_product", "sha256": "10bb034ca3fff53f6625c9fe47ebd054b37ef45d1140af1c766831cfa6871433", "url": "https://raw.githubusercontent.com/PantheonPlusSH0ES/DataRelease/c447f0fea703fcd0fff57de5000947b5ca81286b/SH0ES_Data/ally_shoes_ceph_topantheonwt6.0_112221.fits"}, {"conditioning": "Pinned original paper v3 or release c447f0fea703fcd0fff57de5000947b5ca81286b; selected source checks only. FITS whole-byte hashes are not decoded-array or physical reduction verification.", "id": "run_mcmc.py", "role": "primary_release_code_or_document", "sha256": "00546b9de2d73cd6315c0333b5f7b07a8b948f9e73056a88e76abe0249464c85", "url": "https://raw.githubusercontent.com/PantheonPlusSH0ES/DataRelease/c447f0fea703fcd0fff57de5000947b5ca81286b/SH0ES_Data/run_mcmc.py"}], "title": "Released row-3213 conditional source contract"}, {"limitations": ["Accepted identities are conditional on the declared redshift factors and selected exact source snapshots. Source-adopted dipole, flow parameters, dispersions and fit outputs are not independently measured inputs or physical laws.", "Carr's projected square-root Doppler factor and Peterson's linear radial factor remain distinct source prescriptions; neither supplies a checked telescope observer worldline, ephemeris, aberration, coordinate epoch or event clock.", "The source reconstruction uses galaxy density, external calibration and group choices with selection and smoothing dependence. Its lack of SN-distance use does not prove joint independence from all shared observations or other galaxy probes.", "Peterson Eq10's literal units/normalization are unresolved. Its printed density-weighted comoving-distance prior is not replaced by an inferred volume prior; no executable likelihood, Gaussian law or repair is accepted.", "Uncertainty propagation can depend on reconstruction position and produce non-Gaussian or multi-valued redshift inference. Peterson's assumed 250 km/s dispersion and Brout's conditioned 240 km/s floor have different roles; unknown cross-covariance is not zero.", "Duplicate aliases and structural CID/epoch linkage do not establish a complete physical event identity. The existing ten coordinate-rounding failures, undefined MJD time scale/flux law and map/event/covariance gates remain open.", "No raw arrays, source-output reproduction, native capability, numerical result, held-out independence or cosmological qualification is admitted."], "scopes": [{"checked_claim": "Carr Sec5 Eqs2–7 separates heliocentric, observer-corrected CMB and host-PV-corrected Hubble-diagram redshifts through multiplicative frequency-ratio factors; Eqs4–5 fix a projected radial blueshift sign. Peterson SecII.1 Eq7 instead uses a linear radial factor in galactic coordinates. Carr Sec6 Eq9 and Sec6.2–6.3 describe a calibrated, interpolated redshift-space reconstruction and chosen external-flow continuation. Peterson SecIII.2–III.3, SecIV.1 and AppendixA describe catalog-dependent group matching and assumed, posterior-conditioned PV uncertainties. Brout SecIII.1.2–III.1.3 distinguishes light-curve and distance redshift roles and conditioned systematic covariance; Scolnic SecIII.2 p1 retains duplicate-event covariance and searches aliases by RA, DEC and PKMJD.", "paper_ids": ["arxiv:2112.01471v2", "arxiv:2110.03487v2", "arxiv:2112.03863v2", "arxiv:2202.04077v2"], "scope_id": "NEXT-06", "title": "Conditional frame and reconstructed-flow conventions", "unresolved": "Complete physical event/frame/clock and observer four-velocity ancestry, exact velocity-grid/group/configuration/calibration ownership, normalization/support and joint covariance remain open. The projected radial prescriptions do not establish a complete Lorentz/frequency-transfer model. Peterson original HTML Eq10's dimensional residual/velocity-width convention and probability measure require original PDF/TeX and implementation clarification before likelihood use. Existing coordinate failures and unknown cross-probe covariance remain blocking."}], "sources": [{"conditioning": "Exact v2-labelled HTML selected math/prose. Its abstract counts differ from the archived metadata snapshot; source-variant ancestry unresolved. Truncated local PDF excluded. Rights/licence unknown; no raw redistribution.", "id": "carr-redshift-v2-selected-html", "role": "html", "sha256": "eb5c7d943ff293f09c11784e10e0931d8810546936d808e5d67857a24a6395b9", "url": "https://arxiv.org/html/2112.01471v2"}, {"conditioning": "Selected radial correction, group/reconstruction and uncertainty-method description; assumed normal PV scatter is conditioning. Eq10 likelihood units/measure unresolved; PDF/implementation equivalence unverified. Rights/licence unknown; no raw redistribution.", "id": "peterson-pv-v2-selected-html", "role": "html", "sha256": "130b154d16078b7b406ac192da8c19db2cafef90a1dd6105be43edf55114c9dd", "url": "https://arxiv.org/html/2110.03487v2"}, {"conditioning": "Selected duplicate-alias/shared-covariance prose only; no exact covariance equation or raw-event identity admission. Rights/licence unknown; no raw redistribution.", "id": "scolnic-dataset-v2-duplicate-context-html", "role": "html", "sha256": "2c853a30cad35cd63a3097520235e5e772c645f717aba847708eecc2e5cb98a0", "url": "https://arxiv.org/html/2112.03863v2"}, {"conditioning": "Selected redshift-role and PV systematic-covariance conditioning; fitted floors/alternative-map construction are not universal statistical laws. Rights/licence unknown; no raw redistribution.", "id": "brout-cosmology-v2-pv-context-html", "role": "html", "sha256": "7580cd8300bf5bf53119735a06c94f7240a7426c37a4f2e8fdbf9915905ecb38", "url": "https://arxiv.org/html/2202.04077v2"}], "title": "Pantheon+ redshift factors, host flows and observer lineage"}, {"limitations": ["The paper’s covariance concerns fitted magnitude offsets; choosing a Gaussian or other normalized native density from it requires an additional declared statistical model and source/input evidence.", "Eq5 prints a half-weight prior term and compact summation/index notation. Its prose assigns priors per survey-filter; no summation repair, log-density normalization or sampler target is inferred.", "Correlations among zeropoint offsets differ from the chosen uncorrelated mean-wavelength perturbations. The source omits their cross-correlations; physical zero covariance or independent calibration measurements is not established.", "Nine mock realizations are systematic propagation samples, not nine measured optical states, a finite population law or observed probability masses.", "The prior Table3/NPZ count discrepancy, PS1 Public/PS1SNe/Foundation mapping, CFA3S r/i versus R/I, passband/zeropoint sign and event-level joins remain unresolved.", "Source selection cuts, synthetic standards, repeated telescope calibrations, prior widths, survey weights and uncertainty floors condition the fit. Raw catalogues, standards, response curves and full dependency covariance remain unverified.", "SALT2 retraining and distance covariance propagation remain empirical and conditioned; no template-format, first-principles luminosity, numerical accuracy or measured detector likelihood is qualified.", "The checked wavelength-shift pathway is retraining followed by downstream fitting with the changed SALT2 surfaces. No separate direct wavelength-shift implementation in the fitting passbands is certified."], "scopes": [{"checked_claim": "Brout Sec3.1 defines survey-filter offsets through observed tertiary-star magnitude differences and synthetic CALSPEC/NGSL transformations. Eq5 is a weighted objective with scatter/N, error floors and zero-centred prior penalties; emcee produces a fitted uncertainty covariance. Sec4.3 and AppendixA propagate correlated zeropoint realizations through SALT2 retraining and subsequent light-curve fitting. Uncorrelated mean-wavelength shifts enter retraining and affect subsequent fits through the resulting SALT2 surfaces. Sec6 explicitly omits zeropoint–wavelength correlations from those systematics. These are conditioned estimation and propagation choices.", "paper_ids": ["arxiv:2112.03864v2"], "scope_id": "NEXT-08", "title": "Fitted calibration uncertainty versus measured optical probability", "unresolved": "No normalized native likelihood or optical-state/arrival/QE/gain/extraction/censoring law follows from this objective or fitted covariance. Actual star/error inputs, fitting implementation, coordinate measure/normalization, joint zeropoint–wavelength covariance and draw generator remain unverified. Preserve 105-filter prose versus 102 fitted-release coordinates, unresolved machine aliases/passbands/events and shared calibration covariance."}], "sources": [{"conditioning": "Fitted filter-magnitude offsets and author-chosen propagation through SALT2 retraining/light-curve fitting; not a native optical-event probability law.", "id": "brout-2112-03864v2-calibration-html", "role": "html", "sha256": "5e042f44faa5204afb941c9e8914d6920409a67429673bc8ac01e6c990265805", "url": "https://arxiv.org/html/2112.03864v2"}, {"conditioning": "Fitted filter-magnitude offsets and author-chosen propagation through SALT2 retraining/light-curve fitting; not a native optical-event probability law.", "id": "brout-2112-03864v2-calibration-pdf", "role": "pdf", "sha256": "022ae1a5fa3ceda36caac295c1a4cc0b1ef4cab28f818564c62e353e1750ae74", "url": "https://arxiv.org/pdf/2112.03864v2"}], "title": "Calibration fit objective and conditioned systematic propagation"}, {"limitations": [" ximate window Eqs18-20 and2048-mock auto/cross covariance. Sec8.1, Table3 third column and Eqs23,25,27 specify one CMASS pre-reconstruction full-AP fit at zeff0.57,kmax0.22 h Mpc^-1. The source reports a conditioned f*sigma8/amplitude-geometry summary with model-error inflation; Table5 combines distinct overlapping RSD/BAO fits. Accepted source reporting is limited by the original printed normalization/label/boundary caveats.", "paper_ids": ["arxiv:1606.00439v2"], "scope_id": "NEXT-13", "title": "CMASS full-AP P0/P2/B0 fitted product", "unresolved": "Actual estimator/window/mask/covariance/likelihood/prior/calibration assets and amplitude/species/full-k compatibility are not qualified. Eq28 covariance/exponent and Eq14 orientation conventions remain unresolved; reader corrections are separate. Joint likelihood use requires known dependence/covariance. No executable request, independent amplitude measurement or source-result reproduction is accepted."}], "sources": [{"conditioning": "Pinned original1606.00439v2, selected estimator/AP/window/covariance/Table3 and Table5 checks only; original PDF math visually checked in frozen source audit.", "id": "boss1606-00439v2-html", "role": "html", "sha256": "d3538b300d0b0490dee538b4c5327f694b78bec515e9ed8c820f96466baf560d", "url": "https://arxiv.org/html/1606.00439v2"}, {"conditioning": "Pinned original1606.00439v2, selected estimator/AP/window/covariance/Table3 and Table5 checks only; original PDF math visually checked in frozen source audit.", "id": "boss1606-00439v2-pdf", "role": "pdf", "sha256": "7026e8dd7e51a07adde8940c380dded16391ad90a49c6ba321393d0fde1fe823", "url": "https://arxiv.org/pdf/1606.00439v2"}], "title": "BOSS DR12 CMASS conditioned power/bispectrum RSD estimator"}, {"limitations": ["Released pre-reconstruction cap P/B estimates and separate2016a/b power products are source-owned reductions. They are not raw galaxy observations, an independent amplitude measurement, a qualified likelihood, or an executable native model.", "2016 archive contains weighted NGC+SGC power estimates, diagonal errors, bestfit curves, power-only covariance and window matrices. Its covariance cannot replace the P0/P2/B0 joint auto/cross covariance. Arrays/dimensions/interleaving were not numerically validated.", "Current release pre-reconstruction P headers report cap data effective redshifts0.589341/0.590627 and randoms0.547267/0.547683, distinct from analysis zeff0.57. Definitions are preserved; no automatic replacement or proof of contradiction. Historical estimator/byte equality to the2017 paper is unestablished.", "Exact selected bin/triangle order and paired mock realization IDs are required for all auto/cross covariance blocks. No mocks were downloaded/read, no covariance constructed or inverted, no Hartlap likelihood correction executed. Page11 line278 labels B mocks post-recon while notes/data say pre-recon; pairing/reconstruction is unresolved.", "Masks supply already-squared W_l^2, not a complete bispectrum survey window. Notes offer only a partial individual-power approximation with squeezed-triangle limitations. Density units and intrinsic headerless B/mask self-description remain unlocated; dimensional reader deductions are separate.", "Formal notes are incomplete on RSD/AP/selection/LOS physics. Printed Eq2 Fourier normalization/measure, Eq5 triangle count normalization, p3 linear-bin units, Eq9 likelihood label, Eq14 internal operator and Table1 Patchy sigma8=8288 issues remain literal. No silent repair or author-code equivalence is accepted.", "Source claims of independent sky-cap/sample likelihoods and arbitrary high-k validity are reported assertions, not verified independence or scientific qualification. Same galaxy, random, fiducial, mask and mock ancestry links power-only RSD, P+B RSD and post-reconstruction BAO; cross-analysis covariance remains unknown. Linear/log P are alternative reductions, not independent samples.", "Source-specific redistribution licences are unresolved. Citation requests, as-is disclaimers, successful public GETs and a failed connector materialization establish no licence or licence denial. Only metadata, links and original short review notes may be public; raw sources stay local.", "Asset-only targeted review; navigation association to existing1606.00439v2 does not review that paper anew."], "scopes": [{"checked_claim": "Original Hector Gil-Marin notes dated13Feb2020 and author pages dated17Feb2020 identify pre-recon P data, B0 data, post-recon BAO and separate bestfit products. Current exact linked archives and ten CMASS members are hash-bound; P comment headers and notes locate seven-column P/B formats, physical units and already-subtracted shot noise; notes identify already-squared six-column cap mask functions and weighted density roles. June2016 README distinguishes cap-averaged power measurements, bestfit curves, power-only covariance and rectangular window matrices. Original notes require paired2048 MD-Patchy statistics for a chosen P/B data vector with full auto/cross covariance; source reporting alone is accepted.", "paper_ids": ["arxiv:1606.00439v2"], "scope_id": "NEXT-13", "title": "Selected CMASS release identities, formats and covariance requirements", "unresolved": "Exact historical release/estimator identity, full numerical support/order, mock realization pairing and reconstruction label conflict, author code, complete survey/B window and priors/likelihood remain unresolved. No joint covariance, fit, independence, numerical implementation or executable request accepted. Earlier NEXT13 fit contract remains separate."}], "sources": [{"conditioning": "Selected HTML title/description, lines 100/116, 154–173, 191–241, 363 and 378; analysis roles, author date and exact linked route. Images not inspected; fit/fiducial files unacquired.", "id": "boss-release-dr12-page", "role": "html", "sha256": "6b10cd354876a5ad1a7f3fcb224e3487aba01ea78937a8d3c6116f475c318560", "url": "https://www.ub.edu/bispectrum/pag mask output is distinct from the older six-field released squared-moment mask. A verified adapter and exact convention/normalization mapping are required; no implicit conversion is accepted.", "The current cut-sky parser, shot-noise options, random weights, density conventions, mask LOS and normalization choices require an exact selected configuration and data ancestry. No full bispectrum survey-window closure or historical window application has been established.", "A complete paired P0/P2/B0 vector, all auto/cross covariance blocks, exact selection/bin order, finite-mock correction and likelihood law remain unqualified. Separate source counters with equal totals do not prove paired valid ID sets; unknown cross-covariance is not zero.", "BOSS fitted fσ8 remains a conditioned summary with shared galaxies, mocks, BAO geometry and unknown external cross-covariance. Neither current model options nor header effective redshifts establish an independent observation or an ordinary σ8 prediction at a declared epoch with full-k 8 h^-1 Mpc top-hat support and compatible matter/species physics.", "Historical printed AP/likelihood issues and earlier release-note ambiguities remain separately preserved. Current code does not resolve them or reproduce the historical source outputs. Public access and null licence metadata do not establish redistribution permission.", "Current RR normalization semantics require a valid nonzero W0 denominator and valid pair-mean bins. The selected fallback search does not certify those conditions or a refusal outside them; no observed validity or guard qualification is inferred."], "scopes": [{"checked_claim": "Selected CMASS/NGC power-mock headers declare catalogue/random ancestry, processing choices and seven output fields. Selected bispectrum first records have seven fields, distinct from the eleven-field current BRASS parser/RUSTICO writer. Current code exposes catalogue-weight, shot-noise, random-window LOS/normalization and joint-vector covariance choices; these are conditional implementation requirements. The RR-mask writer puts bin center before pair-mean separation despite opposite literal header labels.", "paper_ids": ["arxiv:1606.00439v2"], "scope_id": "NEXT-13", "title": "Mock lineage, estimator conventions and joint P/B conditioning", "unresolved": "Physical paired realization/reconstruction identity, exact historical implementation/configuration, full row/grid/triangle order, B/mask adaptation, estimator calibration and complete survey-window/covariance/likelihood ancestry remain open. Equal mock counts do not certify paired valid ID sets. Shared galaxies/mocks/geometry and unknown cross-covariance prevent independent amplitude interpretation."}], "sources": [{"conditioning": "Selected author code-navigation anchors121/143 identify RUSTICO estimator and BRASS fitting roles; linked legacy implementations and papers not inspected.", "id": "boss-current-code-links", "role": "html", "sha256": "f60a8e33ab047494f77ff1e436a2b7661be94e96dc5142a432eb5c25e1aaeec5", "url": "https://www.ub.edu/bispectrum/page9.html"}, {"conditioning": "Pinned0d7609e3b5fbd2e62e18d361cfacc44bc25f1516; selected README/cut-sky reader, output/shot-noise and auto-RR mask passages only. Current code is not verified historical2017 implementation.", "id": "rustico-pinned-source", "role": "pinned_code_archive", "sha256": "6b1de60c073c33fb180d380dcbf499c2e6d6c22a8c5db3f7d187e154de2f2d5c", "url": "https://api.github.com/repos/hectorgil/Rustico/zipball/0d7609e3b5fbd2e62e18d361cfacc44bc25f1516"}, {"conditioning": "Pinned478a961a262c478bd2b4ee587652f99f2ff7d299; selected README/parsers/configuration/covariance source passages only. No historical2017 parameter/likelihood equivalence or execution.", "id": "brass-pinned-source", "role": "pinned_code_archive", "sha256": "ae24807333adab60382ef762b5def0092f7335927f317b293cb5f8bd2b33bab1", "url": "https://api.github.com/repos/hectorgil/Brass/zipball/478a961a262c478bd2b4ee587652f99f2ff7d299"}, {"conditioning": "Full archive byte identity pinned; only selected linear CMASS/NGC1000/1001 headers checked. Drive2021 creation metadata does not establish historical2017 output identity; numeric bodies and physical pairing unexamined.", "id": "boss-power-mock-archive", "role": "author_linked_mock_archive", "sha256": "a3bb298c26dbe2d39af6af712ffd07c2b9618713e0be07ffaae8a20f4c91bb38", "url": "https://drive.google.com/file/d/1fCg0A2zGQQnVpZenmLabqBknDlfHbPUX/view?usp=sharing"}, {"conditioning": "Full confirmed gzip byte identity pinned; only selected CMASS/NGC run1000/1001 first-record structure checked. Filename matching and earlier post/pre labels do not establish physical pairing/reconstruction. No transient confirmation URL is an asset identity.", "id": "boss-bispectrum-mock-archive", "role": "author_linked_mock_archive", "sha256": "2d59afb38cda795886f0e4cd91a81044dd042a53feb4092ac69aa314665cccb5", "url": "https://drive.google.com/file/d/1cX3hE_0d7UeYlOWoAW92ZXkEIf4eqz3P/view?usp=sharing"}], "title": "BOSS DR12 selected mock formats and current estimator requirements"}, {"limitations": ["Historical code commit, build/configuration and actual producer/output ancestry remain unknown. Current 2023/2025 code, a repository named Rustico_old or a retrospective Papers where used link cannot fill that gap. The linked old documentation and journal bodies were unavailable; cached arXiv v2 identity is retained.", "The paper's 2048 MD-Patchy, 1000 QPM and 20 selection-free halo populations have different roles and cosmologies. Published counts do not identify released files, valid paired IDs, reconstruction status or an independent mock population.", "The fixed analysis fiducial model differs from mock-generating cosmologies; AP and fixed spectral-shape/nuisance conditioning must be preserved. No full Planck-species model or native engine defaults are inferred.", "Binned P0/P2/B0 covariance is distinct from the later compressed 8x8 RSD/BAO covariance. The latter combines mock correlations with data-fit variance estimates. Shared galaxies/mocks/BAO geometry imply dependence; unknown cross-covariance remains unknown.", "The bispectrum window is an approximation that neglects window action on the shape factor; source tests and low-k exclusions are conditional. Actual W2/W3, random/mask support, positive normalization, shot-noise and historical output conventions remain unverified.", "Printed grid/boundary, AP k/q/triangle-closure/angular-normalization and compressed-likelihood/diagonal terminology issues remain preserved. No source repair, current-code correction or historical result reproduction is accepted.", "Source fσ8 is a fitted summary. The checked σ8(z)=D(z)σ80 relation leaves the complete 8 h^-1 Mpc top-hat/full-k/matter-species definition unresolved and does not admit a finite-band reduced-sector variance under that name.", "All current-to-released output adapters, full windows/auto-cross covariance, likelihood/prior/selection/calibration ownership and consumer/numerical/physical gates remain open. Public availability and unknown licences do not grant raw redistribution."], "scopes": [{"checked_claim": "Original Sec 2–3 describes weighted galaxy/random catalogues, distinct power/bispectrum normalizers, a closed-triangle bispectrum monopole estimator, varying-LOS power multipoles, FFT/bin choices and area-weighted caps. The analysis uses a fixed fiducial cosmology distinct from mock-generating cosmologies. Its 2048 MD-Patchy realizations support covariance/model checks; 1000 QPM realizations test fibre-collision effects; 20 periodic halo catalogues test models without survey selection. Sec 5.3–6.2 locates AP transformations, an approximate bispectrum window, P0/P2/B0 auto/cross covariance and a conditioned Gaussian-fit assumption. Sec 8.4/Appendix C describes dependent compressed RSD/BAO products. The current author Codes page retrospectively associates RUSTICO with the 2016 paper; that link does not identify the actual historical code version.", "paper_ids": ["arxiv:1606.00439v2"], "scope_id": "NEXT-13", "title": "Pre-reconstruction method, population roles and historical code identity", "unresolved": "Exact contemporaneous code/parameter/build/output provenance, historical randoms/masks/windows, discrete bin/triangle ownership, shot-noise/Fourier normalization and complete likelihood/covariance assets are unverified. Current RUSTICO/BRASS snapshots and released filename suffixes do not establish historical 2016/2017 implementation, paired realizations or reconstruction identity. A verified adapter and matching physical, fiducial, selection, normalization and covariance conventions remain required."}], "sources": [{"conditioning": "Pinned 26 Oct 2016 v2 with 27 Oct 2016 preprint header; selected original identity/method/mock/AP/window/covariance passages checked. Journal-version equivalence is unresolved; this is selected-source coverage.", "id": "boss1606-00439v2-pdf", "role": "pdf", "sha256": "7026e8dd7e51a07adde8940c380dded16391ad90a49c6ba321393d0fde1fe823", "url": "https://arxiv.org/pdf/1606.00439v2"}, {"conditioning": "Pinned original source anchors support selected claims; important estimator/AP/window equations checked against original-PDF renders. Unselected sections, references and arrays remain unexamined.", "id": "boss1606-00439v2-html", "role": "html", "sha256": "d3538b300d0b0490dee538b4c5327f694b78bec515e9ed8c820f96466baf560d", "url": "https://arxiv.org/html/1606.00439v2"}, {"conditioning": "Selected RUSTICO/BRASS paragraphs and literal links only. RUSTICO lists a paper under 2016 and links Rustico_old documentation/current code; selected BRASS usage links name 2020. This is retrospective navigation; contemporaneous implementation/version identity remains unverified.", "id": "boss-author-codes-navigation-snapshot", "role": "author_navigation_snapshot", "sha256": "f60a8e33ab047494f77ff1e436a2b7661be94e96dc5142a432eb5c25e1aaeec5", "url": "https://www.ub.edu/bispectrum/page9.html"}], "title": "BOSS DR12 historical estimator and mock-population ancestry"}, {"limitations": ["Selected original source equations and conditional reader algebra/protocol specification only; this distinct ideal photon/cold-baryon closure does not replace the accepted collisionless FD model.", "All seven implementation/control/installed/numerical/physical gates remain open; helper-self-refusal is unsupported and actual background/conservation forcing must be charged.", "Cold baryon zero pressure is additional closure. No finite opacity, recombination/drag history, diffusion, photon hierarchy/polarization, CMB projection, full standard transfer, ordinary full-support sigma8, observational law or inference.", "The acoustic consumer and two-row request are specifications; no installed native caller or numerical qualification is established."], "scopes": [{"checked_claim": "Original MB64 (PDFp22), MB67 (p23) and MB70 (p24) support the declared infinite momentum-coupling limit after enthalpy-weighted exchange cancellation. Native loading is reciprocal to printed R_MB. Zero baryon thermal pressure, no relics/other radiation, smooth nonnegative Lambda and initial zero baryon/photon entropy are explicit ideal choices. Corrected9B/2 comoving equations, Hamiltonian propagation, regular radiation/total-matter series, recorded finite-start projection, independent loaded oscillator/original TRACE and signed four readouts were checked as reader derivations. Actual copied thermal source separates baryon/CDM fractions and mapping units; the old helper needs a total-matter extension and does not itself refuse baryons.", "paper_ids": ["arxiv:astro-ph/9506072v1"], "scope_id": "NEXT-14", "title": "Distinct ideal common photon and cold-baryon transfer", "unresolved": "Exact continuum cancellation assumes compatible background; actual closure/derivative/conservation forcing, including native Delta forcing, must be bounded and charged. Growing raw TRACE residual, native projected-mode bias, mixed finite-start omissions, shared background/age/arithmetic, coupled time stability, endpoint and forward allocations remain open. Private loading/sound-speed ownership needs a narrow shared helper and new consumer API. The synthetic two-row request and fixed budgets/caps/refusal rules are conditional specifications, with no installed, compiled or resource pass. All G01–G07 remain open. This ideal acoustic model remains distinct from the collisionless massless-FD model."}, {"checked_claim": "Intrinsic signed delta_gamma/4 per asymptotic unit zeta is a conditional readout of this separate ideal acoustic model. Original MB99–101 (PDFp34) are accepted only as a no-shear approximate constant-sound-speed formal control; their radiation specialization does not supply the loaded physical trajectory.", "paper_ids": ["arxiv:astro-ph/9506072v1"], "scope_id": "NEXT-19", "title": "Intrinsic ideal photon temperature only", "unresolved": "No opacity, visibility, recombination, drag prediction, diffusion, polarization, ordinary photon free streaming, angular/line-of-sight temperature spectrum or observed likelihood is included. Full primary CMB and physical-history acceptance remain open."}], "sources": [{"conditioning": "Selected original Newtonian photon/baryon momentum equations and approximate no-shear constant-sound-speed control; new ideal closure, regular-series/comoving/TRACE algebra and frozen numerical policies are reader choices.", "id": "astro-ph__9506072v1-pdf", "role": "pdf", "sha256": "8893f63227cbf374853265e43d62af19a1ba726e7e0b0b575fdeed5fb0c0575a", "url": "https://arxiv.org/pdf/astro-ph/9506072v1"}], "title": "Conditional ideal photon and cold-baryon acoustic source with CDM and smooth Lambda"}, {"limitations": ["Exact-mass0 FD species with identical regular adiabatic brightness may share transport, while original mass/temperature/statistical-weight tuples and order remain retained. Positive mass, supplied photons, baryons and unidentified nonphoton massless sectors are excluded; no full Planck/standard transfer or CMB identity.", "Retain the inspected ThermalBackground ownership, implicit sector roles, wide normalization/error/status/method semantics and conversions. Species has no name/role field. Successful copied preparation at8bccb6c enforces nonnegative Lambda; the one-sided age tail applies only in that domain with positive radiation and positive lower-age denominator.", "Unit zeta=-phi+delta_rho/[3(rho+P)], stable coordinates, conformal-age envelope, initial projection and RK4 guards are reader-derived algebra, not printed MB/CLASS prescriptions. Source MB51 endpoint is approximate; no UFA/RSA is selected.", "Projected-leading pure-radiation Delta=(7/19)zeta*x_i^2 with dV=0 differs from regular growing Delta=zeta*x_i^2/4 and dV=-3psi0*x_i^2/40. A satisfied Hamiltonian does not certify growing-mode purity, finite-start bias or forward error.", "Chosen phase\u003c=20, k1e-7..1e-2 Mpc^-1, target a1e-4..1, L32/64/128 and endpoint step guards remain proposed/unqualified. Initial, background, age, time, hierarchy, peer, resource and consumer gates remain blocked; empirical refinement is not a forward certificate.", "A separate consumer review reports at2026-10-03T02:43 context that the raw trace angular peer has a growing Hamiltonian residual mode and centered shear alone does not admit it. This report is not locally reproduced; damping and higher-precision alternatives are pending independent source derivations, with no acceptance or execution in this projection.", "Shared MB equations/thermal/mode ancestry remains disclosed for native and angular-peer proposals.", "Ordinary full-spectrum matter amplitude and later primordial/window normalization are not accepted."], "scopes": [{"checked_claim": "MB Eqs4-5,22-23,27,43,46-51,98 and finite-start warning locate Newtonian metric/conservation/transport/constraint signs, CDM comoving density, approximate hierarchy endpoint and leading regular adiabatic mode. CLASSII Sec3,3.1 dat"}], "title": "Pantheon+ calibration coordinates and selected B21 empirical template source gates"}, {"limitations": ["Guy Sec2.1 permits basis dependence in poorly constrained regions. Sec4.2 regularization introduces estimator bias, assessed by author simulations based on SALT; the reported0.005mag K-correction criterion is conditional, not an independent accuracy certificate. Historical10x120/10x60 basis sizes are not released grid dimensions.", "Guy Sec3 selection requires premaximum sampling, excludes1991bg-like SNe and uses the fitted model to assess host contamination. Spectra share light-curve calibration and host subtraction; exact event-level training/evaluation overlap, selection probabilities and cross-covariances remain unchecked.", "Guy Sec6 uses jackknife retraining because a separate large validation sample was unavailable. Remaining residuals are still correlated; independent residual treatment assumes temporal correlation shorter than typical sampling. Full component covariance is not a measured joint detector or event covariance.", "Original Guy PDF6/HTML S6.Ex8 prints H0,i multiplying both M0 and M1 in the residual normalization equation, while the preceding variance expression uses H0/H1 separately and Sec4.3 gives different basis sizes. The literal indices are preserved; an executable basis reconciliation is unresolved.", "Brout IV.3 jointly propagates training/fitting perturbations to distance covariance; VI.p8 says filter shifts were omitted from the simultaneous calibration fit and varied in training without zeropoint correlations. This model choice does not establish zero physical cross-covariance. Source-added training, CALSPEC and CSP systematics remain conditional choices.", "The release README's broad nine-correlated-realizations wording is kept distinct from the paper's correlated-zeropoint/uncorrelated-wavelength split. Nine variants are systematic analysis perturbations. Paper sigma_k=1/3, historical ALL.fitopts0.3 and nonzero shift_0 remain distinct; nominal MODEL000 mapping is not inferred from suffix0.", "SALT2.INFO options, SIGMA_INT0.106 and error-floor literals do not establish units/distributions of released error maps, a Gaussian optical state, physical reddening, held-out accuracy or a complete measured noise law. Absolute flux normalization, color-law version mapping and all unexamined template/reader bodies remain open.", "Only listed original-source passages and one historical coverage figure are checked. Full training tables, standards/filter bodies, cited training sources and unlisted figures/appendices remain unexamined."], "scopes": [{"checked_claim": "Guy Sec2 Eq1 defines F=x0[M0(p,lambda)+x1*M1(p,lambda)+...]exp[c*CL(lambda)], with rest-frame phase since B maximum and rest-frame wavelength; global components/color law and per-SN fitted normalization/components/color. Color can include intrinsic variation or dust or both. Sec2.1/2.2/3 condition the empirical model on heterogeneous ensemble coverage, photometric spectral recalibration, assumed white spectral noise, chosen spectral weights, premaximum sampling and model-dependent host-contamination cuts. Sec4 fits components and calibration together, using second-derivative regularization in weakly constrained regions. Historical construction spans−20..+50 days and2000..9200 Angstrom. Sec6 estimates residual errors by leave-one-SN-out retraining and per-SN refitting; remaining correlations are acknowledged before an assumed diagonal simplification. Component covariance projected by H0/H1 and rescaled by S(p,lambda) is training-model uncertainty. Brout IV.1/IV.3 retrains B21 with changed zeropoints/filter functions; nine calibration variants propagate jointly through retraining and light-curve refitting. Survey zeropoint draws are correlated, effective-wavelength shifts are uncorrelated inputs in that analysis. Pantheon+ fitting3000..7000 Angstrom is distinct from c447 MODEL000 INFO range2800..7000. INFO/README configuration literals and nominal/variant roles are checked.", "paper_ids": ["arxiv:astro-ph/0701828v1", "arxiv:2112.03864v2"], "scope_id": "NEXT-09", "title": "Empirical spectral sequence, selected training ancestry and conditional error propagation", "unresolved": "The empirical sequence is not a first-principles emitted-luminosity, photon-arrival, detector/extraction or selection likelihood. Full MODEL000 grid/column/flux normalization, version1 color polynomial/extrapolation, relative-error normalization/interpolation and covariance closure remain unresolved. Historical basis support is not complete observed coverage or current released support. Training-object/calibrator overlap and unknown cross-covariance require explicit lineage; no fitted x0/x1/c summary is accepted as a native law."}], "sources": [{"conditioning": "Historical 2007v1 selected Sec2–4/6 definitions, training/selection/recalibration and residual assumptions; exact anchors in targeted review.", "id": "guy-astro-ph-0701828v1-html", "role": "html", "sha256": "bab88504c4bce299c5a765c722b3c4fa040eed3830c924a6438762e0a7985952", "url": "https://arxiv.org/html/astro-ph/0701828v1"}, {"conditioning": "Original pages2/4/5/6 checked through rehashed existing renders; Eq1, regularization, historical support and empirical residual-error formulas.", "id": "guy-astro-ph-0701828v1-pdf", "role": "pdf", "sha256": "a89d6be7eb6b76fe9a83fce8e2f3a8eda99ca35c0d20c71c580d2a83a99b42e3", "url": "https://arxiv.org/pdf/astro-ph/0701828v1"}, {"conditioning": "Selected IV.1/IV.3 and VI.p8 original prose/math: B21 retraining and downstream systematic propagation; correlated zeropoints versus uncorrelated wavelength shifts are source modelling choices.", "id": "brout-2112-03864v2-html", "role": "html", "sha256": "5e042f44faa5204afb941c9e8914d6920409a67429673bc8ac01e6c990265805", "url": "https://arxiv.org/html/2112.03864v2"}, {"conditioning": "Pinned v2 original bytes rehashed as source identity; no fresh PDF visual coverage or independent numerical reproduction.", "id": "brout-2112-03864v2-pdf", "role": "pdf", "sha256": "022ae1a5fa3ceda36caac295c1a4cc0b1ef4cab28f818564c62e353e1750ae74", "url": "https://arxiv.org/pdf/2112.03864v2"}, {"conditioning": "Complete17-line configuration only; range/color/interpolation/error-floor literals do not decode full MODEL000 grids or specify a native likelihood.", "id": "Pantheon+_Data/3_SALT2/SALT2_B21trained_withsys/SALT2.MODEL000/SALT2.INFO", "role": "pinned_release_asset", "sha256": "6cb38b88565eec41cb4e18eb7a973a58da02223af0f1579d6ead37f9ec330dfa", "url": "https://raw.githubusercontent.com/PantheonPlusSH0ES/DataRelease/c447f0fea703fcd0fff57de5000947b5ca81286b/Pantheon%2B_Data/3_SALT2/SALT2_B21trained_withsys/SALT2.MODEL000/SALT2.INFO"}, {"conditioning": "Complete short README: nominal MODEL000, nine systematic variants and trainopts/fitopts roles. Its broad nine-correlated-realizations wording is less specific than Brout IV.3/VI.", "id": "Pantheon+_Data/3_SALT2/README", "role": "pinned_release_asset", "sha256": "7b14123f47ea879afe59b68de23983fd93376392bc9c58c91bc487af44c8468a", "url": "https://raw.githubusercontent.com/PantheonPlusSH0ES/DataRelease/c447f0fea703fcd0fff57de5000947b5ca81286b/Pantheon%2B_Data/3_SALT2/README"}], "title": "SALT2 empirical temporal training and residual-error conditioning"}, {"limitations": ["The declared baselines are historical SDSS-II Stripe82/SMPv8+BOSS reduced photometry and the named Suyu2010 B1608 observations/reductions; they are source identities, not a combined physical model or independent datasets.", "Unknown pixel, extraction, calibration, delay, kinematic and environment cross-covariances remain unknown. No Gaussian, Poisson, independent-event or detector censoring law is inferred from gain/read-noise columns, uncertainty bars, offset covariance or posterior summaries.", "The B1608 template-derived dispersion is an aperture/spectral-fit measurement with reported statistical and template-mismatch uncertainty. Its environment prior conditions simulated sightlines on selected galaxy counts, including an approximate F814W magnitude from simulated SDSS i/z magnitudes; this is not a measured optical passband bridge.", "No raw detector history, complete lens likelihood, parameter tolerance, executable numerical request or scientific qualification is supplied. Missing assets in this bounded check are unacquired or unresolved, not demonstrated absent."], "scopes": [{"checked_claim": "The historical SDSS-II Stripe82 release distinguishes corrected fpC images, uncalibrated fpObjc catalogs and calibrated tsObj catalogs. Its fpC format document distinguishes photo v5_3/DR1 from v5_2/EDR sky handling and says full aa/kk photometric calibration follows frame creation. The DR1 example carries ADU/DN pixel units, TAI first-row timing, drift-row clock and exposure time; those belong to the example. The pinned c447 SDSS reduced release instead contains calibrated photometry with blank TUNIT values and no EXPTIME, with README ancestry through SMPv8+BOSS and Holtz/v6_reCalib. The kcor input separately names SDSS_Doi2010_CCDAVG passbands and external SEDs.", "paper_ids": ["arxiv:2112.03863v2", "arxiv:2112.03864v2"], "scope_id": "NEXT-10", "title": "Historical SDSS-II detector and reduction chain", "unresolved": "The physical event/CID/epoch to actual run, camcol, field, native exposure and reduction-version join is unresolved. No native SDSS detector array, bias/readout law, measured gain/read-noise uncertainty, per-epoch PSF/mask/sky covariance or extraction operator is acquired here. The example exposure/TAI convention cannot be assigned to PHOT. Native counts to microJy/asinh/AB/FLUXCAL, filter-body units and zeropoint calibration/covariance, censoring and full detection/followup/analysis selection remain incomplete. HST imaging/filter assets cannot fill this SDSS bridge."}, {"checked_claim": "The pinned Suyu et al. v2 source names ACS GO10158, PI Fassnacht, F606W/F814W and model-dependent PSF/dust/lens-light reductions; the official proposal body now matches the title/PI and selected ACS/WFC archive records J93501010/20/30/40 for B1608+656. Older proposal6555 is a distinct WFPC2 dataset. The paper separately names radio delays relative to imageB, Keck1/LRIS red exposures on 2007-06-12, aperture/template-dependent stellar dispersion and an OBS external-convergence prior conditioned on galaxy counts and simulations. Pinned H0LiCOW README describes B1608 analytical distance fits as inference products.", "paper_ids": ["arxiv:0910.2773v2"], "scope_id": "NEXT-18", "title": "B1608+656 named observations and conditioned reductions", "unresolved": "Matched proposal metadata does not supply raw or calibrated pixel files, exact pipeline/product versions, units/clock convention, PSF ensembles, masks/dust/lens-light/potential reductions or image covariance. Original monitoring light curves and joint delay covariance, Keck spectra/templates/aperture/seeing likelihood, environment catalog completeness and conditioned simulated sightline assets remain unacquired. The reported stellar dispersion includes statistical and template-mismatch uncertainty and is not an SIS parameter. An external-convergence prior is not a direct convergence measurement. Cross-covariances and original-data joint likelihood remain unknown; distance-fit summaries do not replace these assets."}], "sources": [{"conditioning": "HTML lines159-164 identify separate historical lightcurve/catalog/image/coadd routes. DR17 page version is not the historical photometry product version. Linked destinations and raw data remain unexamined.", "id": "sdss-dr17-supernova-entry", "role": "official historical-data route metadata", "sha256": "14800c48c8d23384dbedf70f3cf9dd8fde50deb152f8e21cffd5aafb527a09b7", "url": "https://www.sdss4.org/dr17/data_access/supernovae/"}, {"conditioning": "Title and main content lines14-131 checked. Release includes processed adverse-condition data; pipeline quality under poor conditions is not fully characterized. Quality flags are not a complete transient selection probability.", "id": "sdss-drsn-release-entry", "role": "official SDSS-II release and quality documentation", "sha256": "cd117897c8b87ea1a7e8eba58f369f2dfffb8927b10038cef86f8430b5c80125", "url": "https://classic.sdss.org/drsn/DRSN_data_release.php"}, {"conditioning": "HTML lines3-159 checked. DR1 photo v5_3_53 example, including53.907456s exposure and26322microsecond/row clock, is not an actual released SMPv8 event. tsField aa/kk link is named but unopened; legacy template explicitly warns it is obsolete.", "id": "sdss-fpc-format", "role": "official version-specific corrected-frame format and example header", "sha256": "75e865c133a82b567bd212a52270a3fe207ae22e8b43a921773b6a577a38108b", "url": "https://classic.sdss.org/dr7/dm/flatFiles/fpC.php"}, {"conditioning": "Original bytes rehashed; retained previously decoded header has19 blank TUNIT values and absent EXPTIME. No fresh data-array reading or measured physical detector distribution is accepted.", "id": "SDSS_allCandidates+BOSS_PHOT.FITS.gz", "role": "released_reduced_product", "sha256": "0b143978c068c0b93b78eb582701bf77286b1930cfa93ce436ef30b5722a5a05", "url": "https://raw.githubusercontent.com/PantheonPlusSH0ES/DataRelease/c447f0fea703fcd0fff57de5000947b5ca81286b/Pantheon%2B_Data/1_DATA/photometry/JLA2014_SDSS_DS17/SDSS_allCandidates%2BBOSS_PHOT.FITS.gz"}, {"conditioning": "Lines1-108 and191-212 checked. SMPv8+BOSS2005-2007 derives from Holtz/v6_reCalib; Feb2010 error scaling uses FLUXERR(uJy), and QMASK bits describe partial epoch-quality conditions.10258 lightcurve containers are not a physical-event deduplication count.", "id": "JLA2014_SDSS_DS17.README", "role": "pinned release conversion and error-treatment description", "sha256": "653e5ca44de6f29265923bf24b1ade3d9ec7b6586a7c49f278163ea59b2b426a", "url": "https://raw.githubusercontent.com/PantheonPlusSH0ES/DataRelease/c447f0fea703fcd0fff57de5000947b5ca81286b/Pantheon%2B_Data/1_DATA/photometry/JLA2014_SDSS_DS17/JLA2014_SDSS_DS17.README"}, {"conditioning": "All41 lines checked without execution. AB/COUNT labels, U/G/R/I/Z passband paths, external BD17/Hsiao SEDs, offset expressions and generation grids are configuration choices. Referenced curve bodies and units for untagged wavelength-shift literals remain unexamined; no optical/detector probability law is supplied.", "id": "kcor_SDSS.input", "role": "pinned calibration configuration", "sha256": "b27008fc0be2dd94c21bafc38bee49d08cea38d9ff157777b14376705a2b93c1", "url": "https://raw.githubusercontent.com/PantheonPlusSH0ES/DataRelease/c447f0fea703fcd0fff57de5000947b5ca81286b/Pantheon%2B_Data/2_CALIBRATION/SNANA_kcor/kcor_SDSS.input"}, {"conditioning": "Title/authors/version watermark and selected Sec3.1, Sec4.1/p8/Fig1, Sec5.1-5.2 data descriptions and Sec6.2/footnote15 checked. Figures other than p8 are uninspected; p12 Fig2 caption only. Literal November26,2024 draft header versus January28,2010 arXiv watermark remains unexplained. No complete lens data law or numerical qualification follows.", "id": "b1608-0910.2773v2-original", "role": "pinned original paper, selected data-description claims", "sha256": "49713641ce2c8c82994f6365b112dc349b1388b048819f712ab565a4043feeff", "url": "https://arxiv.org/pdf/0910.2773v2"}, {"conditioning": "Title/PI/cycle13/completed GO and first4 of page-declared30 rows checked: J93501010/20 with F606W and J93501030/40 with F814W, ACS/WFC, target B1608+656. Rows are archive dataset identifiers, not certified individual raw exposures or author reductions. ExpTime/CentralWavelength units and clock standard are not stated in checked table/header. No pixel or product files acquired.", "id": "b1608-go10158-proposal", "role": "official matched proposal and selected archive-dataset metadata", "sha256": "42b8b56a184e3f6e32a8c0a76b767d6b53ed3d2e88ae05f4439c29c1d7c32620", "url": "https://archive.stsci.edu/proposal_search.php?id=10158\u0026mission=hst"}, {"conditioning": "Dataset field lines65-138 and structured rights metadata checked: WFPC2/WFPC2-PC,1997-1999 temporal coverage,version1.0. Generic page keywords do not change instrument identity. This is not GO10158 ACS and cannot substitute for SDSS or later B1608 imaging.", "id": "b1608-older-wfpc2-6555", "role": "distinct historical WFPC2 dataset metadata", "sha256": "00920c25c9b3de8a10c89e00ba579786a20fd10af110063f6e6ce1b910fbfd6a", "url": "https://esdcdoi.esac.esa.int/doi/html/data/astronomy/hst/6555.html"}, {"conditioning": "Complete short README read; exact revision and Git blob independently checked. B1608 Suyu2010 time-delay-distance and Jee2019 angular-distance analytical fits are inferred summaries. Chains, notebooks, inference implementations and their conditionings remain unexamined.", "id": "h0licow-pinned-readme", "role": "pinned inference-product description", "sha256": "e4804af66b108488ad8b56459119d652fb43992aec135c9f121b310c64420b5c", "url": "https://raw.githubusercontent.com/shsuyu/H0LiCOW-public/57cf97357e16a94ba0065472bd4185cfbc604aa3/README.md"}], "title": "SDSS detector-to-photometry and B1608+656 original asset requirements"}, {"limitations": ["Dataset baselines are the original2005 SDSS scene-model reduced source labelled5.04, the later pinned c447 SMPv8+BOSS reduced release, and one current archival HST GO10158 F606W RAW/engineering/association product snapshot. They are distinct products and reduction histories, not a joint independent-data model.", "HST count payloads are acquired and their declared header/layout checked; image values and engineering telemetry are unanalysed. Counts do not establish electrons, QE, photon/readout distribution, censoring or calibrated photometry. RAW ERR/DQ encode constant-zero placeholders via NPIX1/2 and PIXVALUE, without pixel payload. They are not measured zero uncertainty or verified clean quality. Gain/read-noise/photometric zeros are not zero noise/calibration uncertainty.", "Current CALACS10.4.1 processing log and DrizzlePac3.11.0 association metadata do not identify or reproduce the source paper2010 PSF/dust/lens-light/potential/drizzle processing. Only one of four ASN exposures is locally acquired; full F606W/F814W imaging and calibrated products, reference bodies, PSF ensembles/masks/image covariance remain unacquired.", "Literal legacyCID6057→epoch→RUN5566/82N is now checked, and a separate c447 HEAD row declares allCandidates PHOT pointers. Physical event deduplication, legacy→SMPv8 reduction/flux/error equivalence, camcol/field/native exposure, per-epoch clock standard, exposure/readout operator, sky/calibration/QE and full selection bridge remain unresolved. HST assets cannot substitute for SDSS.", "The old Suyu paper identity/selected-source review remains ancestry: printed November26,2024 draft header versus January28,2010 v2 watermark stays unresolved, and older WFPC2 GO6555 is distinct. Radio time series/joint delay covariance, Keck spectra/templates/aperture/seeing, environment selection/simulated sightlines and their joint likelihood remain unacquired.", "Pixel, extraction, calibration, delay, kinematic, environment and cross-probe covariances/distributions remain unknown, not zero or Gaussian/Poisson. Error components, read-noise/gain metadata and fitted distance summaries do not supply a measured physical law or physical history.", "Selected archival data are PUBLIC with a checked general MAST public-domain/exceptions policy; author-product ownership/licences and SDSS redistribution rights remain unverified. Unacquired or unread assets are not proven absent."], "scopes": [{"checked_claim": "Original2005 scene-model SN6057/2005if file explicitly labels native SDSS asinh magnitudes, AB-corrected microJy, random/sky/galaxy error components and uncorrected foreground extinction. Selected first g epoch53616.457598 binds RUN5566/82N. The separately pinned JLA-named HEAD primary PHOTFILE names SDSS_allCandidates+BOSS_PHOT.FITS; selected NUL-normalized row2864 binds6057/2005if,NOBS115 and pointers313798..313912.56 HEAD TUNIT cards are present/blank; inherited later PHOT19 TUNIT cards are present/blank and EXPTIME absent.", "paper_ids": ["arxiv:2112.03863v2", "arxiv:2112.03864v2"], "scope_id": "NEXT-07", "title": "Versioned SDSS flux, timing and exposure bridge", "unresolved": "Source5.04-labelled original photometry and SMPv8+BOSS/FLUXCAL are separate reduction identities; equal epoch/CID/pointer labels do not certify flux/error/calibration equivalence or physical-event deduplication. Native frame/camcol/field, MJD clock convention, EXPTIME/readout/calibration/QE/error covariance and full selection remain unresolved; no HST clock/exposure substitution."}, {"checked_claim": "Official selected run5566/rerun40/nightMJD53616/N has processed field range11..622 and UT run interval05:11:04..11:15:43. Source documents nonphotometric frame recalibration, restrictedRA range, g/camcol3 zero-point QA in millimags, ambiguous zeroQA, processing gaps and per-run rolling field IDs. Legacy source flags/runs/strips improve reduced-product ancestry without a native detector law.", "paper_ids": ["arxiv:2112.03863v2", "arxiv:2112.03864v2"], "scope_id": "NEXT-10", "title": "SDSS native detector and selection prerequisites", "unresolved": "No native SDSS pixels, actual frame header, measured gain/read-noise uncertainty/distribution, per-epoch PSF/mask/sky/extraction operator or censoring/followup/analysis selection likelihood is checked. Run/strip is insufficient for unique camera column/field; flag descriptions do not give detection probability. Existing fpC/TAI example and passband configuration remain version-specific ancestry, not this event exposure."}, {"checked_claim": "MAST selected j93501010 association and PUBLIC product rows, RAW/SPT headers, current LOG and five-row ASN match GO10158/PI-Fassnacht/B1608+656/ACS-WFC/F606W. H9Q has two4144×2068 count-image payloads in a34344000B file,609s exposure and UT-labelled2004-08-24 start; ERR/DQ encode cons ified interpretation; the 2022 interpretation cannot be borrowed.", "paper_ids": ["arxiv:1801.08023v3"], "scope_id": "NEXT-12", "title": "Selected scalar constants and mass-density inputs", "unresolved": "No universal isotope input/default, BBN abundance prediction, joint covariance or background consistency is qualified. The kg/u conversion is evaluated, not exact; no mixed-epoch kg mass scalar is generated."}, {"checked_claim": "Ordinary Thomson q_z=c sigma_T n_e/[H(1+z)], tau_0(z)=integral_0^z q_z dz and g_z=q_z exp(-tau_0) use the today boundary. CLASS emits a positive collision rate and visibility per conformal length; per-redshift visibility needs the absolute Jacobian. If a qualified finite 0\u003c=L\u003c=U encloses the omitted late depth, tau_0 lies in [tau_B+L,tau_B+U], with survival/visibility bounds from the monotone exponential. The finite-interval visibility mass retains both missing late scope and upper survival; no normalization to one. reio_none returns xe_before, not zero electrons.", "paper_ids": ["arxiv:1801.08023v3"], "scope_id": "NEXT-16", "title": "Conditional late Thomson depth and distinct drag weighting", "unresolved": "The actual L and U are null: no matching qualified late-electron history or deterministic envelope is supplied. Today depth/visibility remain blocked. Drag requires its separate weighted tail integral q_z/R_b with R_b=3 rho_b/(4 rho_gamma); an unweighted Thomson interval does not determine physical drag, a root or r_d. No CMB or full CLASS equivalence is accepted."}], "sources": [{"conditioning": "Bounded original-source locators only; no complete source, independent measurement, native implementation or scientific qualification.", "id": "CODATA2022_selected_constants", "role": "selected_primary_source", "sha256": "5c4a2c8127a80698d05f4d682bd4cac200dabcd9c2e9dd783661a0aa60f4bb1c", "url": "https://physics.nist.gov/cuu/pdf/all.pdf"}, {"conditioning": "Bounded original-source locators only; no complete source, independent measu
