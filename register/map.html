t population or changed selection/calibration law is supplied by the existing ladder fit."}, {"checked_claim": "Heliocentric spectral/time redshift, CMB-frame redshift and peculiar-velocity corrected expansion redshift have separate roles; use exact multiplicative relations.", "paper_ids": ["arxiv:2112.01471v2", "arxiv:2110.03487v2", "arxiv:2112.03863v2", "arxiv:2202.04077v2"], "scope_id": "NEXT-06", "title": "SDSS event, observer and velocity lineage", "unresolved": "The prior 321 structural joins and consumer event ledger do not establish complete physical event/frame identity; retain coordinate failures, source velocity-model ancestry and unknown cross-covariance."}, {"checked_claim": "Released FLUXCAL and its error are calibrated light-curve quantities. Preserve all source flags and epochs.", "paper_ids": ["arxiv:2112.03863v2", "arxiv:astro-ph/0701828v1"], "scope_id": "NEXT-07", "title": "Calibrated light curve to exposure units", "unresolved": "Selected FITS photometry TUNIT cards are present with blank unit values; EXPTIME is absent. Clock standard, zero point, wavelength convention, extraction covariance and physical flux/electron bridge remain incomplete."}, {"checked_claim": "Original Table3 contains102 numerical rows and8 NA rows; the pinned NPZ has102 ordered labels and a102x102 fitted-offset covariance.", "paper_ids": ["arxiv:2112.03864v2"], "scope_id": "NEXT-08", "title": "Calibration summaries to optical-state law", "unresolved": "The105 prose count and PS1/CFA3S filter aliases are unresolved. Fitted magnitude-offset covariance does not define transmission curves or measured state probabilities."}, {"checked_claim": "SALT2 uses trained rest-frame phase/wavelength surfaces, per-event amplitude/shape/color and an empirical color law.", "paper_ids": ["arxiv:astro-ph/0701828v1", "arxiv:2112.03863v2", "arxiv:2112.03864v2"], "scope_id": "NEXT-09", "title": "Empirical temporal template", "unresolved": "B21 release training surfaces, exact units/support/interpolation, training uncertainty and physical detector bridge remain incomplete; color is not automatically a dust parameter."}, {"checked_claim": "Gain/readnoise and calibrated extraction errors have separate detector and reduction roles.", "paper_ids": ["arxiv:2112.03863v2", "arxiv:2112.03864v2"], "scope_id": "NEXT-10", "title": "Measured detector law", "unresolved": "Raw exposure electrons, detector response/censoring/extraction covariance and a measured joint detector law are not supplied by these reduced products."}, {"checked_claim": "The pinned DESI DR2 fitted compression has13 ordered ratios with all169 covariance entries; the final Lyalpha pair is DH then DM. Table4 reports marginalized posterior means/stddev under reconstruction and nuisance assumptions.", "paper_ids": ["arxiv:2503.14738v3", "arxiv:1807.06209v4"], "scope_id": "NEXT-11", "title": "Thermal BAO compression", "unresolved": "A conditional supplied-drag ruler is not predicted physical drag. Template/reconstruction/model domain, covariance conditioning and independent source/consumer acceptance remain required; cross-probe covariance is unknown."}, {"checked_claim": "Pitrou X_i=A_i*n_i/n_b is a pseudo-mass fraction; rho_b, average baryon mass, eta and thermal history specify the conversion to number densities.", "paper_ids": ["arxiv:1801.08023v3", "arxiv:1807.06209v4"], "scope_id": "NEXT-12", "title": "Abundance and temperature law", "unresolved": "Supplied independent nucleus inventories and temperature histories do not implement BBN. Planck PArthENoPE1.1/neutron880.2s conditioning cannot silently become PRIMAT or an unrelated mass convention."}, {"checked_claim": "BOSS DR12 uses explicit fiducial geometry, AP mappings, nonlinear power/bispectrum modelling, nuisance parameters, window and mocks. Table3 P+B and Table5 BAO+RSD f*sigma8 are different products.", "paper_ids": ["arxiv:1606.00439v2"], "scope_id": "NEXT-13", "title": "Observed RSD estimator and AP contract", "unresolved": "Window/mask/mocks/full covariance and estimator validation are not acquired. The same galaxy samples underlie BAO and RSD, so the compressed fits are not independent data."}, {"checked_claim": "Original Newtonian-gauge Einstein/fluid equations support the separately declared perfect self-interacting radiation+CDM+Lambda transfer and finite primordial-band variance. Its initial expansions are reviewer-derived.", "paper_ids": ["arxiv:astro-ph/9506072v1", "arxiv:1104.2933v3", "arxiv:1807.06209v4"], "scope_id": "NEXT-14", "title": "Linear transfer and amplitude", "unresolved": "This removes baryons, collisionless relics, anisotropic stress and the photon hierarchy. Ordinary full-spectrum sigma8, faithful Planck transfer and independent numerical acceptance remain open."}, {"checked_claim": "The separately named F_H1/NIST/RecfastCLASS singlet hybrid uses independent nuclei densities, shared electron charge, matter-temperature rates and Compton/adiabatic temperature evolution on a finite interval. A separate reviewed serialization pins seven H/He ionization, electron-mass and exact SI scalar facts; H I and He II are ASD theory-marked.", "paper_ids": ["arxiv:astro-ph/9909275v2", "arxiv:1801.08023v3"], "scope_id": "NEXT-15", "title": "Coupled non-LTE H/He kinetics", "unresolved": "Ground-state LTE remains an artificial supplied boundary. The seven-scalar subset leaves ASD uncertainty distribution/coverage and covariance unknown; original complete H1/B2 pins, isotope/mass conventions, excitation and rate closure, sigma_T/G/unlisted constants, HeIII omission, fit extrapolation and numerical/consumer history gates remain unresolved."}, {"checked_claim": "Physical drag uses baryon-weighted Thomson depth from today and tau_drag(z_d)=1; comoving r_d is the sound horizon at that predicted endpoint.", "paper_ids": ["arxiv:astro-ph/9909275v2", "arxiv:2503.14738v3"], "scope_id": "NEXT-16", "title": "Physical drag endpoint", "unresolved": "An interval ending at z300–600 omits the late opacity contribution. A qualified late/reionization continuation and tail/boundary budget are required; visibility and drag are distinct."}, {"checked_claim": "Observed sample cuts, light-curve fitting, simulated bias correction and systematic variant selection belong to the population law.", "paper_ids": ["arxiv:2112.03863v2", "arxiv:2202.04077v2", "arxiv:astro-ph/0701828v1"], "scope_id": "NEXT-17", "title": "Selected source population", "unresolved": "S21 all-cuts across40 perturbations and B22 baseline-cuts plus BBC intersection are distinct source descriptions. Parent population, selection/censoring efficiency and variant execution ancestry remain incomplete."}, {"checked_claim": "B1608+656 uses lens/source redshifts, relative delays, imaging/PSF/dust/potential, aperture stellar kinematics and an environment-conditioned external-convergence prior.", "paper_ids": ["arxiv:0910.2773v2"], "scope_id": "NEXT-18", "title": "Named strong-lens likelihood", "unresolved": "Full pixel/PSF/kinematic aperture data, delay covariance and line-of-sight prior assets remain missing. The template-derived velocity dispersion is not an SIS parameter; simulation prior is not a direct convergence measurement."}, {"checked_claim": "A primary projection needs a closed photon/baryon/polarization/species/metric system, primordial normalization and sourced full visibility history. Dimensionless and Kelvin spectra are separate identities.", "paper_ids": ["arxiv:astro-ph/9506072v1", "arxiv:astro-ph/9603033v1", "arxiv:1104.2933v3", "arxiv:1907.12875v2", "arxiv:1807.06209v4"], "scope_id": "NEXT-19", "title": "Primary CMB observable", "unresolved": "Printed LOS survival/sign/coefficient issues are preserved separately from reviewer-derived MB-consistent repairs. Perfect-fluid transfer and finite thermal opacity supply neither primary spectra nor a measured Planck likelihood."}], "title": "Full ΛCDM reference", "topic_ids": ["baseline-reference"], "unknowns": ["Complete source readings have not occurred in this targeted task.", "Consumer release asset hashes, exact selections and comparison budgets belong to the Reproducible packet and are not yet accepted here.", "Unknown cross-probe covariances stay unknown.", "Faithful Planck physics and full likelihood stack are not implemented.", "The102 calibration covariance axes are structurally resolved;105 count/filter aliases, physical exposure/selection laws, and complete lens/RSD/CMB asset and physics closure remain open."]}, {"additional_source_contracts": [], "baseline": {"label": "Planck base ΛCDM comparison", "parameters": null, "parameters_reason": "Exact sourced values and chosen inputs are separately pinned in the candidate numerical reference.", "role": "comparison", "scope": "Changed neutrino/thermal sector and exact synthetic control point; Planck is contextual reference."}, "cosmology": {"background": "E(a)^2=Omega_r/a^4+Omega_m/a^3+Omega_Lambda; chosen fractional inputs, Lambda from flatness.", "components": ["Pressureless baryons and nonbaryonic matter", "Photons and permanently massless radiation", "Cosmological constant"], "geometry": "Spatially flat FLRW", "gravity": "General relativity", "modifications": ["Replace massive-neutrino/thermal sector with explicitly chosen massless fractional controls; supplied synthetic drag endpoint."], "observables": ["E(z), D_M(z) and D_L(z) at z=0,0.1,0.7,2.33,5", "All 13 ordered D_M/r_d, D_H/r_d or D_V/r_d release coordinates", "BAO Gaussian quadratic, log determinant, normalization and log density", "Twin H0 control with fractions, supplied drag and release covariance fixed"], "perturbations": "Not included in this limited comparison."}, "id": "lcdm-massless-conditional-comparison", "idea_ids": ["planck-conditioned-base-lcdm", "bao-compressed-relative-ruler", "massless-supplied-drag-comparison"], "investigations": [{"assumptions": ["ΛCDM is a declared reference, not an established unique truth or replacement for registered alternative cosmologies.", "Freeze exact versions, <script>
'use strict';
const data=JSON.parse(document.getElementById('prospector-data').textContent), $=id=>document.getElementById(id);
const prospects=new Map((data.prospects||[]).map(x=>[x.id,x]));
const ideas=new Map(data.ideas.map(x=>[x.id,x])), papers=new Map(data.papers.map(x=>[x.id,x]));
const labels={specializes:'Specialization',partial_overlap:'Partial overlap',physically_distinct:'Distinct physics',shares_data:'Shared data',critiques:'Critique',motivates:'Motivation',updates:'Update',cites:'Cites'};

const all={id:'all',title:'All topics',idea_ids:data.ideas.map(x=>x.id),paper_ids:data.papers.map(x=>x.id)};
let topic='all',view='prospects',selected=null,query='',familyFilter=null,connectionTimeline=false;
function el(tag,text,parent,attrs={}){const e=document.createElement(tag);if(text!=null)e.textContent=text;for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(parent)parent.append(e);return e}
function link(parent,text,url){return el('a',text,parent,{href:url,target:'_blank',rel:'noopener'})}
function group(){return topic==='all'?all:data.groups.find(x=>x.id===topic)||all}
function matches(x){return !query||[x.title,x.id,x.family||'',familyLabels[x.family]||'',...(x.authors||[])].join(' ').toLowerCase().includes(query)}
function setHash(){const p=new URLSearchParams({topic,view});if(selected)p.set('item',selected);history.replaceState(null,'','#'+p)}
function route(){familyFilter=null;query='';$('search').value='';const p=new URLSearchParams(location.hash.slice(1));topic=[all,...data.groups].some(x=>x.id===p.get('topic'))?p.get('topic'):'all';view=['ideas','papers','connections','citations','prospects','reading'].includes(p.get('view'))?p.get('view'):'prospects';selected=ideas.has(p.get('item'))||papers.has(p.get('item'))||prospects.has(p.get('item'))?p.get('item'):null;render();if(selected)detail(selected,false)}
function render(){const g=group();const viewCounts={connections:data.edges.filter(e=>g.idea_ids.includes(e.from)&&g.idea_ids.includes(e.to)).length,ideas:g.idea_ids.length,papers:g.paper_ids.length,citations:data.citations.filter(c=>g.paper_ids.includes(c.from)&&g.paper_ids.includes(c.to)).length,prospects:(data.prospects||[]).filter(p=>topic==='all'||p.topic_ids.includes(topic)).length,reading:g.paper_ids.filter(id=>papers.get(id).read).length};for(const b of document.querySelectorAll('[data-view]')){let count=b.querySelector('small');if(!count)count=el('small','',b);count.textContent=viewCounts[b.dataset.view]}$('topic-title').textContent=topic==='all'?'Cosmology':g.title;$('totals').textContent=`${viewCounts.prospects} prospects · ${g.idea_ids.length} ideas · ${g.paper_ids.length} papers`;
for(const b of $('topics').querySelectorAll('[data-topic]'))b.setAttribute('aria-current',String(b.dataset.topic===topic));for(const b of document.querySelectorAll('[data-view]')){const active=b.dataset.view===view;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1}$('view').setAttribute('aria-labelledby','tab-'+view);$('view').replaceChildren();
if(view==='papers')renderPapers(g);else if(view==='connections')renderConnections(g);else if(view==='citations')renderCitations(g);else if(view==='prospects')renderProspects(g);else if(view==='reading')renderPapers({...g,paper_ids:g.paper_ids.filter(id=>papers.get(id).read)});else renderIdeas(g);setHash()}
function ideaNode(id,parent){const x=ideas.get(id),b=el('button',null,parent,{class:'node'+(selected===id?' selected':''),'data-node':id,'data-tone':tones[x.family]||'plum'});el('span',x.title,b);el('small',familyLabels[x.family]||x.family.replaceAll('_',' '),b);b.onclick=()=>detail(id);return b}
function treeNode(id,parent,children,branch=new Set()){const row=el('div',null,parent,{class:'tree'});ideaNode(id,row);if(branch.has(id))return row;const next=new Set(branch).add(id),ids=children.get(id)||[];if(ids.length){const box=el('div',null,row,{class:'children'});for(const child of ids)treeNode(child,box,children,next)}return row}
function connectForest(forest,relations){const old=forest.querySelector('svg');if(old)old.remove();const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');const w=forest.scrollWidth,h=forest.scrollHeight;svg.setAttribute('width',w);svg.setAttribute('height',h);svg.setAttribute('aria-hidden','true');forest.prepend(svg);const box=forest.getBoundingClientRect();const coords=new Map([...forest.querySelectorAll('[data-node]')].map(e=>{const r=e.getBoundingClientRect();return[e.dataset.node,{x:r.left-box.left,y:r.top-box.top,w:r.width,h:r.height}]}));for(const {from,to} of relations){const a=coords.get(from),b=coords.get(to);if(!a||!b)continue;const path=document.createElementNS(ns,'path'),x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2,m=(x1+x2)/2;path.setAttribute('d',x2<x1?`M${a.x+18} ${a.y+a.h} V${y2} H${x2}`:`M${x1} ${y1} C${m} ${y1},${m} ${y2},${x2} ${y2}`);path.setAttribute('class','edge-line');svg.append(path)}}
let forestObserver;function watchForest(forest,relations){forestObserver?.disconnect();forestObserver=new ResizeObserver(()=>connectForest(forest,relations));forestObserver.observe(forest);requestAnimationFrame(()=>connectForest(forest,relations))}
function renderIdeas(g){const ids=g.idea_ids.filter(id=>matches(ideas.get(id))&&(!familyFilter||ideas.get(id).family===familyFilter));if(!ids.length){el('div',query?'0 ideas':'0 ideas',$('view'),{class:'empty'});return}const chosen=new Set(ids),children=new Map(),childIds=new Set(),links=[];
for(const e of data.edges)if(e.type==='specializes'&&chosen.has(e.from)&&chosen.has(e.to)){if(!children.has(e.to))children.set(e.to,[]);children.get(e.to).push(e.from);childIds.add(e.from);links.push({from:e.to,to:e.from})}
const viewport=el('div',null,$('view'),{class:'viewport'}),forest=el('div',null,viewport,{class:'forest'});const size=id=>1+(children.get(id)||[]).reduce((n,c)=>n+size(c),0);for(const id of ids.filter(x=>!childIds.has(x)).sort((a,b)=>size(b)-size(a)))treeNode(id,forest,children);watchForest(forest,links);
}
function renderConnections(g){const toggle=el('button','Timeline',$('view'),{class:'relation','aria-pressed':String(connectionTimeline)});toggle.onclick=()=>{connectionTimeline=!connectionTimeline;render()};if(connectionTimeline){renderTimeline(g);return}const chosen=new Set(g.idea_ids),edges=data.edges.filter(e=>chosen.has(e.from)&&chosen.has(e.to)&&(matches(ideas.get(e.from))||matches(ideas.get(e.to))));const section=el('section',null,$('view'),{class:'connection-list'});if(!edges.length)el('div','0 connections',section,{class:'empty'});for(const e of edges){const row=el('div',null,section,{class:'connection-row'});const a=el('button',ideas.get(e.from).title,row);a.onclick=()=>detail(e.from);const type=el('button',labels[e.type],row,{class:'connection-type'});type.onclick=()=>{detail(e.from);edgeDetail(e,e.from)};const b=el('button',ideas.get(e.to).title,row);b.onclick=()=>detail(e.to)}}

function renderTimeline(g){const chosen=new Set(g.idea_ids),events=(data.timeline||[]).filter(t=>chosen.has(t.idea_id)&&matches(ideas.get(t.idea_id))).sort((a,b)=>a.first_source_date.localeCompare(b.first_source_date)||a.idea_id.localeCompare(b.idea_id));el('p','First source publication; connections retain their reviewed meaning.',$('view'),{class:'locator'});for(const event of events){const section=el('article',null,$('view'),{class:'source'});el('div',event.first_source_date,section,{class:'locator'});const b=el('button',ideas.get(event.idea_id).title,section,{class:'paper-title','data-node':event.idea_id});b.onclick=()=>detail(event.idea_id);for(const id of event.source_paper_ids){const p=papers.get(id);link(el('div',null,section,{class:'locator'}),p.title+' ↗',p.url);if(p.updated_date!==p.date)el('div','Version updated '+p.updated_date,section,{class:'locator'})}for(const e of data.edges.filter(e=>e.from===event.idea_id&&chosen.has(e.to))){const relation=el('button',labels[e.type]+' → '+ideas.get(e.to).title,section,{class:'relation'});relation.onclick=()=>{detail(e.from);edgeDetail(e,e.from)}}}if(!events.length)el('div','0 timeline entries',$('view'),{class:'empty'})}

function renderProspects(g){const items=(data.prospects||[]).filter(p=>(topic==='all'||p.topic_ids.includes(topic))&&matches(p));const list=el('div',null,$('view'),{class:'prospect-list'});const labels=el('div',null,list,{class:'assembly-labels'});for(const t of ['Prospect','Baseline','Ideas'])el('span',t,labels);for(const p of items){const row=el('article',null,list,{class:'assembly'});const target=el('button',p.title,row,{class:'assembly-target','data-node':p.id});target.onclick=()=>detail(p.id);el('div',p.baseline.label,row,{class:'assembly-baseline','data-role':p.baseline.role});const changes=el('div',null,row,{class:'assembly-ideas'});for(const [i,id] of p.model_idea_ids.entries()){if(i)el('span',p.kind==='alternative_branches'?'or':'+',changes,{class:'assembly-operator'});const b=el('button',ideas.get(id).title,changes);b.onclick=()=>detail(id)}}if(!items.length)el('div','0 prospects',list,{class:'empty'});el('h3','Combined prospects · '+items.filter(p=>p.kind==='combination').length,list)}
function values(parent,list){if(Array.isArray(list)){const ul=el('ul',null,parent);for(const v of list)el('li',v,ul)}else el('p',list,parent)}
function scienceSection(pane,title,content,open=false){const section=el('details',null,pane,{class:'science-section'});if(open)section.open=true;el('summary',title,section);values(section,content);return section}
function scalarSources(p,pane){if(!p.scalar_sources?.length)return;const section=el('details',null,pane,{class:'science-section'});el('summary','Scalar sources',section);for(const record of p.scalar_sources){el('h3',record.title,section);for(const s of record.scalars){const row=el('div',null,section,{class:'source'});el('p',s.id+' = '+s.decimal_value+' '+s.unit,row);el('div',s.value_class.replaceAll('_',' ')+(s.asd_parenthesized_theory_flag===true?'; ASD theory flag':''),row,{class:'locator'});el('p',(s.uncertainty.decimal_value===null?'Uncertainty unknown':'Source uncertainty: '+s.uncertainty.decimal_value+' '+s.unit)+'. '+(s.uncertainty.interpretation||'Interpretation unknown.'),row);el('div',s.locator,row,{class:'locator'})}scienceSection(section,'Unknowns',record.unknowns);const sources=el('details',null,section,{class:'science-section'});el('summary','Original sources',sources);for(const s of record.sources){const row=el('div',null,sources,{class:'source'});link(row,s.title+' ↗',s.url);el('div',s.source_version||'Source version unknown',row,{class:'locator'});if(s.dataset_provenance)el('p',s.dataset_provenance,row);el('p',s.coverage,row);el('p','Unread: '+s.unread,row);el('div','SHA-256 '+s.sha256,row,{class:'locator'})}}}
function sourceContracts(p,pane){if(!p.additional_source_contracts?.length)return;const section=el('details',null,pane,{class:'science-section'});el('summary','Additional source contracts',section);for(const c of p.additional_source_contracts){const record=el('details',null,section,{class:'science-section'});el('summary',c.title,record);for(const s of c.scopes){el('h3',s.title,record);el('p',s.checked_claim,record);el('p',s.unresolved,record)}scienceSection(record,'Limits',c.limitations);const sources=el('details',null,record,{class:'science-section'});el('summary','Original sources',sources);for(const s of c.sources){const row=el('div',null,sources,{class:'source'});link(row,s.id+' ↗',s.url);el('p',s.conditioning,row);el('div','SHA-256 '+s.sha256,row,{class:'locator'})}}}
function investigations(p,pane){if(!p.investigations?.length)return;const section=el('details',null,pane,{class:'science-section'});el('summary','Candidate investigations',section);for(const c of p.investigations){const record=el('details',null,section,{class:'science-section'});el('summary',c.title,record);el('div',c.readiness.replaceAll('_',' '),record,{class:'locator'});el('p',c.faithful_claim,record);el('p',c.test.question,record);scienceSection(record,'Observables',c.test.observables);scienceSection(record,'Assumptions',c.assumptions);scienceSection(record,'Lost scope',c.simplifications);scienceSection(record,'Unknowns',c.unknowns);const equations=el('details',null,record,{class:'science-section'});el('summary','Equations',equations);for(const e of c.equations){el('p',e.expression,equations);el('div',e.status.replaceAll('_',' ')+': '+e.locator,equations,{class:'locator'});el('p',e.definitions,equations);el('p',e.domain,equations)}}}
function prospectDetail(p,focus=true){$('detail').hidden=false;$('content').classList.add('has-detail');const pane=$('detail');pane.replaceChildren();const head=el('div',null,pane,{class:'detail-head'});el('h2',p.title,head);const close=el('button','×',head,{class:'close','aria-label':'Close details'});close.onclick=closeDetail;if(focus)close.focus({preventScroll:true});el('div',p.readiness.replaceAll('_',' '),pane,{class:'locator'});el('h3',p.baseline.role==='comparison'||p.baseline.role==='working_assumption'?'Reference cosmology':'Baseline',pane);el('p',p.baseline.label,pane);scienceSection(pane,'Changes',p.cosmology.modifications,true);scienceSection(pane,'Unknowns',p.unknowns,true);for(const [key,value] of Object.entries(p.cosmology)){if(key==='modifications')continue;scienceSection(pane,key[0].toUpperCase()+key.slice(1).replaceAll('_',' '),value)}scienceSection(pane,'Scope',p.scope);if(p.source_gates?.length)scienceSection(pane,'Source requirements',p.source_gates.map(s=>s.title+': '+s.checked_claim+' '+s.unresolved));sourceContracts(p,pane);investigations(p,pane);scalarSources(p,pane);scienceSection(pane,'Baseline assumptions',p.baseline.scope);const section=el('details',null,pane,{class:'science-section'});el('summary','Related ideas',section);for(const id of p.idea_ids){const b=el('button',ideas.get(id).title,section,{class:'relation'});b.onclick=()=>detail(id)}el('h3','Papers',pane);const seen=new Set();for(const s of p.source_evidence){if(seen.has(s.paper_id))continue;seen.add(s.paper_id);const paper=papers.get(s.paper_id),row=el('div',null,pane,{class:'source'}),b=el('button',paper.title,row,{class:'paper-title'});b.onclick=()=>detail(paper.id);link(row,'arXiv ↗',paper.url);link(row,'PDF ↗',paper.pdf)}}
function paperInfo(p,parent){el('div',p.authors.join(', '),parent,{class:'authors'})}
function visibilityInfo(p,parent){if(!p.visibility?.length)return;const section=el('details',null,parent,{class:'science-section'});el('summary','Citation and author context',section);for(const v of p.visibility){const row=el('div',null,section,{class:'source'});link(row,v.provider+' ↗',v.url);el('div','Snapshot '+(v.date||'unknown').slice(0,10),row,{class:'locator'});el('p',(v.citation_count===null?'Citation count unknown':v.citation_count+' citations')+(v.count_without_self_citations===null?'':'; '+v.count_without_self_citations+' excluding provider-identified self-citations'),row);el('div','Base work; versions are not counted separately. Age at snapshot: '+Math.floor(v.age_days)+' days.',row,{class:'locator'});el('p',v.cohort_percentile===null?'Age/field rank unavailable. '+v.cohort_reason:'Age/field percentile: '+v.cohort_percentile,row);el('p','Verified author h-indices: '+v.verified_author_metrics+'/'+v.author_count+'; maximum '+(v.max_h_index===null?'unknown':v.max_h_index)+', median '+(v.median_h_index===null?'unknown':v.median_h_index)+'.',row);if(v.author_metric_reason)el('div',v.author_metric_reason,row,{class:'locator'})}el('p','These describe visibility, not scientific evidence.',section,{class:'locator'})}

function renderPapers(g){const list=el('div',null,$('view'),{class:'paper-list'}),items=g.paper_ids.map(id=>papers.get(id)).filter(matches).sort((a,b)=>b.date.localeCompare(a.date)||a.title.localeCompare(b.title));if(!items.length)el('div','0 papers',list,{class:'empty'});for(const p of items){const row=el('article',null,list,{class:'paper-row'});el('div',p.date.slice(0,4),row,{class:'paper-year'});const info=el('div',null,row),b=el('button',p.title,info,{class:'paper-title','data-node':p.id});b.onclick=()=>detail(p.id);paperInfo(p,info);link(row,'arXiv ↗',p.url)}}
function paperNode(p,parent,key){const b=el('button',null,parent,{class:'node','data-node':key});el('span',p.title,b);el('small',p.date.slice(0,4)+' · '+p.base_id,b);b.onclick=()=>detail(p.id);return b}
function renderCitations(g){const chosen=new Set(g.paper_ids),edges=data.citations.filter(e=>chosen.has(e.from)&&chosen.has(e.to)&&(matches(papers.get(e.from))||matches(papers.get(e.to))));if(!edges.length){el('div','0 citation links',$('view'),{class:'empty'});return}const viewport=el('div',null,$('view'),{class:'viewport'}),forest=el('div',null,viewport,{class:'forest paper-tree'}),sources=[...new Set(edges.map(e=>e.from))],links=[];for(const from of sources){const row=el('div',null,forest,{class:'tree'});paperNode(papers.get(from),row,from);const kids=el('div',null,row,{class:'children'});for(const edge of edges.filter(e=>e.from===from)){const child=el('div',null,kids,{class:'tree'}),key=from+'>'+edge.to;paperNode(papers.get(edge.to),child,key);links.push({from,to:key})}}watchForest(forest,links)}
function detail(id,focus=true){if(prospects.has(id)){selected=id;setHash();prospectDetail(prospects.get(id),focus);return}selected=id;setHash();$('detail').hidden=false;$('content').classList.add('has-detail');const pane=$('detail');pane.replaceChildren();const x=ideas.get(id)||papers.get(id),head=el('div',null,pane,{class:'detail-head'});el('h2',x.title,head);const close=el('button','×',head,{class:'close','aria-label':'Close details'});close.onclick=closeDetail;if(focus)close.focus({preventScroll:true});for(const n of document.querySelectorAll('[data-node]'))n.classList.toggle('selected',n.dataset.node===id);
if(ideas.has(id)){for(const [title,values] of [['Assumptions',x.assumptions],['Predictions',x.predictions]]){if(!values?.length)continue;el('h3',title,pane);const list=el('ul',null,pane);for(const v of values)el('li',v,list)}el('h3','Papers',pane);for(const source of x.sources){const p=papers.get(source.paper_id),row=el('div',null,pane,{class:'source'}),b=el('button',p.title,row,{class:'paper-title'});b.onclick=()=>detail(p.id);el('div',source.locator,row,{class:'locator'});link(row,'arXiv ↗',p.url);link(row,'PDF ↗',p.pdf)}const related=data.edges.filter(e=>(e.from===id||e.to===id)&&ideas.has(e.from)&&ideas.has(e.to));if(related.length){el('h3','Connections',pane);for(const e of related){const other=e.from===id?e.to:e.from,b=el('button',null,pane,{class:'relation'});el('span',e.type==='specializes'?(e.from===id?'Specializes':'Specializations'):labels[e.type],b);el('div',ideas.get(other).title,b);b.onclick=()=>edgeDetail(e,id)}}}
else{paperInfo(x,pane);visibilityInfo(x,pane);const source=el('div',null,pane,{class:'source'});link(source,'arXiv ↗',x.url);link(source,'PDF ↗',x.pdf);const abstract=el('details',null,pane,{class:'abstract'});el('summary','Abstract',abstract);abstract.addEventListener('toggle',()=>{if(abstract.open&&!abstract.dataset.loaded){abstract.dataset.loaded='true';loadAbstract(x,abstract)}});const these=data.ideas.filter(i=>i.sources.some(s=>s.paper_id===id));if(these.length){el('h3','Ideas',pane);for(const i of these){const b=el('button',i.title,pane,{class:'relation'});b.onclick=()=>detail(i.id)}}for(const direction of ['from','to']){const links=data.citations.filter(c=>c[direction]===id);if(!links.length)continue;el('h3',direction==='from'?'Cites':'Cited by',pane);for(const c of links){const other=papers.get(c[direction==='from'?'to':'from']),b=el('button',null,pane,{class:'relation'});el('div',other.title,b);el('span',`[${c.reference}] · ${other.base_id}`,b);b.onclick=()=>detail(other.id)}}}}
function edgeDetail(e,origin){const pane=$('detail');pane.replaceChildren();const head=el('div',null,pane,{class:'detail-head'});el('h2',labels[e.type],head);const close=el('button','×',head,{class:'close','aria-label':'Close details'});close.onclick=closeDetail;close.focus({preventScroll:true});el('p',e.rationale,pane);for(const id of [e.from,e.to]){const b=el('button',ideas.get(id).title,pane,{class:'relation'});b.onclick=()=>detail(id)}el('h3','Sources',pane);for(const s of e.evidence){const p=papers.get(s.paper_id);const row=el('div',null,pane,{class:'source'});link(row,p.title+' ↗',p.url);el('div',s.locator,row,{class:'locator'})}}
async function loadAbstract(p,parent){const text=el('p','…',parent);try{const r=await fetch('/api/abstract?id='+encodeURIComponent(p.id),{headers:{Accept:'application/json'}});if(!r.ok)throw new Error();const result=await r.json();if(result.id!==p.id||typeof result.abstract!=='string'||!result.abstract)throw new Error();text.textContent=result.abstract}catch{text.remove();link(parent,'Abstract on arXiv ↗',p.url)}}
function closeDetail(){$('detail').hidden=true;$('content').classList.remove('has-detail');const previous=selected;selected=null;for(const n of document.querySelectorAll('[data-node]'))n.classList.remove('selected');setHash();const b=[...document.querySelectorAll('[data-node]')].find(n=>n.dataset.node===previous);b?.focus({preventScroll:true})}
for(const g of [all,...data.groups]){const wrapper=el('div',null,$('topics'),{class:'topic-item'});const b=el('button',null,wrapper,{'data-topic':g.id});el('span',topicLabels[g.id]||g.title,b,{class:'topic-label'});el('span',String(g.paper_ids.length),b,{class:'count'});b.onclick=()=>{topic=g.id;query='';familyFilter=null;$('search').value='';closeDetail();if(!g.idea_ids.length&&view==='ideas')view='papers';render();document.querySelector('nav').classList.remove('open');document.querySelector('.mobile-topics').setAttribute('aria-expanded','false')};const families=[...new Set(g.idea_ids.map(id=>ideas.get(id).family))];if(families.length>1){const box=el('div',null,wrapper,{class:'topic-families',hidden:''});const expand=el('button','›',wrapper,{class:'expand-topic','aria-label':'Expand '+(topicLabels[g.id]||g.title),'aria-expanded':'false'});expand.onclick=()=>{box.hidden=!box.hidden;expand.textContent=box.hidden?'›':'⌄';expand.setAttribute('aria-expanded',String(!box.hidden))};for(const family of families){const child=el('button',familyLabels[family]||family.replaceAll('_',' '),box);child.onclick=()=>{topic=g.id;view='ideas';query='';familyFilter=family;$('search').value='';closeDetail();render();document.querySelector('nav').classList.remove('open');document.querySelector('.mobile-topics').setAttribute('aria-expanded','false')}}}}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{view=b.dataset.view;familyFilter=null;closeDetail();render()};document.querySelector('.tabs').onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const tabs=[...document.querySelectorAll('[data-view]')],i=tabs.findIndex(t=>t.dataset.view===view),n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;tabs[n].click();tabs[n].focus()};$('search-toggle').onclick=()=>{const input=$('search'),open=input.hidden;input.hidden=!open;$('search-toggle').setAttribute('aria-expanded',String(open));if(open)input.focus();else{input.value='';query='';familyFilter=null;render()}};$('sidebar-toggle').onclick=()=>{const shell=document.querySelector('.shell');shell.classList.toggle('collapsed');$('sidebar-toggle').setAttribute('aria-expanded',String(!shell.classList.contains('collapsed')));$('sidebar-toggle').setAttribute('aria-label',shell.classList.contains('collapsed')?'Expand sidebar':'Collapse sidebar')};$('search').oninput=e=>{familyFilter=null;query=e.target.value.toLowerCase().trim();render()};document.querySelector('.mobile-topics').onclick=e=>{const nav=document.querySelector('nav');nav.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(nav.classList.contains('open')))};window.addEventListener('hashchange',route);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});route();
</script>
