name: Register integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test site/abstract.test.mjs
      - run: uv python install 3.13
      - run: uv sync --locked --python 3.13
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python scripts/validate_register.py
      - run: uv run python scripts/build_register.py
      - name: Generated views are current
        run: git diff --exit-code -- register/README.md register/map.html site/data.json
